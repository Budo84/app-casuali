<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Musichiere della Polenta 🥘</title>
    <style>
        :root {
            --primary: #ffcc00;
            --secondary: #e6b800;
            --spotify: #1DB954;
            --dark: #333;
            --light: #fff9e6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light);
            color: var(--dark);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: var(--primary);
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 { margin: 0; font-size: 2.5em; color: #222; }
        p { margin: 5px 0 0 0; font-weight: bold; color: #555; }
        
        .controls {
            max-width: 800px;
            margin: 20px auto;
            padding: 0 15px;
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex-grow: 1;
            padding: 12px;
            font-size: 1.1em;
            border: 2px solid #ccc;
            border-radius: 8px;
        }
        select {
            padding: 12px;
            font-size: 1em;
            border: 2px solid #ccc;
            border-radius: 8px;
            background: white;
        }
        
        .playlist {
            max-width: 800px;
            margin: 0 auto 50px auto;
            padding: 0 15px;
        }
        .song-card {
            background: white;
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid var(--primary);
            transition: transform 0.1s;
        }
        .song-card:hover { transform: scale(1.02); }
        .song-info { flex-grow: 1; }
        .song-title { font-size: 1.2em; font-weight: bold; margin-bottom: 4px; }
        .song-artist { color: #666; font-size: 0.9em; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            margin-top: 5px;
            background: #eee;
        }
        .btn-play {
            background-color: var(--spotify);
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 4px rgba(29, 185, 84, 0.4);
        }
        .btn-play:hover { background-color: #1ed760; }
        
        /* Colori Categorie */
        .cat-nonni { background-color: #ffcccc; color: #cc0000; }
        .cat-genitori { background-color: #cce5ff; color: #004085; }
        .cat-ragazzi { background-color: #d4edda; color: #155724; }
        .cat-cartoni { background-color: #fff3cd; color: #856404; }
        .cat-jolly { background-color: #e2e3e5; color: #383d41; }
    </style>
</head>

        // Funzione per assegnare il colore in base alla categoria
        function getCategoryClass(category) {
            if (category.includes("Nonni")) return "cat-nonni";
            if (category.includes("Genitori")) return "cat-genitori";
            if (category.includes("Ragazzi")) return "cat-ragazzi";
            if (category.includes("Cartoni")) return "cat-cartoni";
            return "cat-jolly";
        }

        // Renderizza la lista delle canzoni
        function renderSongs(songList) {
            const container = document.getElementById('playlistContainer');
            container.innerHTML = ''; // Svuota il contenitore
            
            songList.forEach((song, index) => {
                // Crea il link di ricerca di Spotify (infallibile per evitare link rotti)
                const searchQuery = encodeURIComponent(`${song.title} ${song.artist}`);
                const spotifyLink = `https://open.spotify.com/search/${searchQuery}`;
                
                const card = document.createElement('div');
                card.className = 'song-card';
                card.innerHTML = `
                    <div class="song-info">
                        <div class="song-title">${index + 1}. ${song.title}</div>
                        <div class="song-artist">🎤 ${song.artist}</div>
                        <div class="badge ${getCategoryClass(song.category)}">${song.category}</div>
                    </div>
                    <a href="${spotifyLink}" target="_blank" class="btn-play">
                        ▶ Play
                    </a>
                `;
                container.appendChild(card);
            });
        }

        // Filtra le canzoni con la barra di ricerca o la tendina
        function filterSongs() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            
            const filtered = songs.filter(song => {
                const matchesText = song.title.toLowerCase().includes(searchText) || song.artist.toLowerCase().includes(searchText);
                const matchesCategory = categoryFilter === "Tutte" || song.category === categoryFilter;
                return matchesText && matchesCategory;
            });
            
            renderSongs(filtered);
        }

        // Inizializza l'app al caricamento
        window.onload = () => renderSongs(songs);
    </script>
