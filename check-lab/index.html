<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist Aula Informatica (Import/Export)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 15px;
            background-color: #f4f4f9;
            color: #333;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .date-display {
            font-weight: bold;
            font-size: 1.1em;
            color: #2c3e50;
        }
        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        button, .file-upload-label {
            border: none;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
            color: white;
            font-family: inherit;
            display: inline-block;
            text-align: center;
        }
        /* Colori Bottoni */
        .btn-pdf { background-color: #e74c3c; } /* Rosso */
        .btn-pdf:hover { background-color: #c0392b; }
        
        .btn-save { background-color: #27ae60; } /* Verde */
        .btn-save:hover { background-color: #219150; }

        .btn-load { background-color: #2980b9; } /* Blu */
        .btn-load:hover { background-color: #21618c; }

        .btn-reset { background-color: #7f8c8d; } /* Grigio */
        .btn-reset:hover { background-color: #2c3e50; }

        /* Input file nascosto */
        #fileInput { display: none; }

        .table-container {
            overflow-x: auto;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1100px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px 5px; /* Celle più compatte */
            text-align: center;
            font-size: 14px;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-size: 0.85em;
            white-space: nowrap;
        }
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #eef2f5; }
        
        .station-name {
            font-weight: bold;
            text-align: left;
            padding-left: 10px;
            width: 80px;
        }
        input[type="checkbox"] {
            transform: scale(1.3);
            cursor: pointer;
        }
        input[type="text"] {
            width: 95%;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 13px;
        }
        
        #statusMsg {
            font-size: 0.9em;
            color: #27ae60;
            margin-right: 10px;
            opacity: 0;
            transition: opacity 0.5s;
            font-weight: bold;
        }

        @media print {
            .controls, h1 { display: none; }
            body { background-color: white; margin: 0; }
            .table-container { box-shadow: none; padding: 0; }
            table { min-width: 100%; }
        }
    </style>
</head>
<body>

    <h1>Gestione Aula Informatica</h1>
    
    <div class="controls">
        <div class="date-display">Data: <span id="currentDate"></span></div>
        <div class="btn-group">
            <span id="statusMsg">Salvato!</span>
            
            <button class="btn-reset" onclick="resetChecklist()" title="Cancella tutto">🔄 Reset</button>
            <button class="btn-save" onclick="exportDataJSON()" title="Salva file dati">💾 Esporta Dati</button>
            
            <label for="fileInput" class="file-upload-label btn-load" title="Carica file dati">📂 Importa Dati</label>
            <input type="file" id="fileInput" accept=".json" onchange="importDataJSON(this)">
            
            <button class="btn-pdf" onclick="exportToPDF()">📄 Scarica PDF</button>
        </div>
    </div>

    <div class="table-container">
        <table id="checklistTable">
            <thead>
                <tr>
                    <th>Postazione</th>
                    <th>HDMI</th>
                    <th>Alim. Mon</th>
                    <th>Cuffie</th>
                    <th>Tastiera</th>
                    <th>Mouse</th>
                    <th>Cavi Corr.</th>
                    <th>Avvio</th>
                    <th>Pass</th>
                    <th>Sfondo</th>
                    <th>Internet</th> <th>Note</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        // --- CONFIGURAZIONE ---
        document.getElementById('currentDate').innerText = new Date().toLocaleDateString('it-IT');
        // Aggiunta voce 'internet' alla lista
        const itemsToCheck = ['hdmi', 'alim_monitor', 'cuffie', 'tastiera', 'mouse', 'cavi_corr', 'avvio', 'pass', 'sfondo', 'internet'];
        const STORAGE_KEY = 'aula_informatica_data_v2';

        // --- GENERAZIONE TABELLA ---
        const tbody = document.getElementById('tableBody');
        
        for (let i = 1; i <= 20; i++) {
            const tr = document.createElement('tr');
            
            // Nome postazione
            let rowContent = `<td class="station-name">Alunno ${i}</td>`;
            
            // Checkbox
            itemsToCheck.forEach(item => {
                rowContent += `<td><input type="checkbox" name="${item}_${i}" onchange="saveState()"></td>`;
            });

            // Campo Note
            rowContent += `<td><input type="text" id="note_${i}" oninput="saveState()"></td>`;
            
            tr.innerHTML = rowContent;
            tbody.appendChild(tr);
        }

        // --- LOGICA SALVATAGGIO AUTOMATICO ---
        function getDataObject() {
            const data = {};
            // Checkbox
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(cb => { if (cb.checked) data[cb.name] = true; });
            // Note
            const notes = document.querySelectorAll('input[type="text"]');
            notes.forEach(note => { if (note.value) data[note.id] = note.value; });
            return data;
        }

        function saveState() {
            const data = getDataObject();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            showStatus();
        }

        function loadState(externalData = null) {
            // Se passiamo dati esterni (import) usiamo quelli, altrimenti carichiamo da localStorage
            let data = externalData;
            
            if (!data) {
                const savedData = localStorage.getItem(STORAGE_KEY);
                if (savedData) data = JSON.parse(savedData);
            }

            if (!data) return;

            // Pulisci prima tutto (per l'import)
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
            document.querySelectorAll('input[type="text"]').forEach(n => n.value = "");

            // Ripristina Checkbox
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                if (data[cb.name]) cb.checked = true;
            });

            // Ripristina Note
            document.querySelectorAll('input[type="text"]').forEach(note => {
                if (data[note.id]) note.value = data[note.id];
            });
            
            // Se abbiamo caricato dati esterni, salviamoli anche nel localStorage corrente
            if (externalData) saveState();
        }

        function showStatus() {
            const msg = document.getElementById('statusMsg');
            msg.style.opacity = 1;
            setTimeout(() => { msg.style.opacity = 0; }, 1500);
        }

        function resetChecklist() {
            if (confirm("Vuoi cancellare tutto e ricominciare?")) {
                localStorage.removeItem(STORAGE_KEY);
                location.reload();
            }
        }

        // --- IMPORT / EXPORT JSON ---
        function exportDataJSON() {
            const data = getDataObject();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "checklist_aula_" + new Date().toISOString().slice(0,10) + ".json");
            document.body.appendChild(downloadAnchorNode); // required for firefox
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }

        function importDataJSON(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);
                    loadState(data);
                    alert("Dati importati con successo!");
                } catch (err) {
                    alert("Errore nella lettura del file. Assicurati che sia un JSON valido.");
                }
            };
            reader.readAsText(file);
            input.value = ''; // Reset input per permettere di ricaricare lo stesso file
        }

        // --- EXPORT PDF (OTTIMIZZATO PER PAGINA UNICA) ---
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            // 'l' = landscape, 'mm' = millimetri, 'a4' format
            const doc = new jsPDF('l', 'mm', 'a4');

            doc.setFontSize(16);
            doc.text("Report Aula Informatica", 14, 12);
            doc.setFontSize(10);
            doc.text("Data: " + new Date().toLocaleDateString('it-IT'), 14, 18);

            const tableRows = [];
            // Intestazioni aggiornate
            const headers = [["Postazione", "HDMI", "Alim Mon", "Cuffie", "Tastiera", "Mouse", "Cavi", "Avvio", "Pass", "Sfondo", "Internet", "Note"]];

            for (let i = 1; i <= 20; i++) {
                let rowData = [`Alunno ${i}`];
                itemsToCheck.forEach(item => {
                    const checkbox = document.querySelector(`input[name="${item}_${i}"]`);
                    // 'X' è più visibile e compatto di 'OK' per tabelle dense
                    rowData.push(checkbox.checked ? "OK" : "");
                });
                const noteVal = document.getElementById(`note_${i}`).value;
                rowData.push(noteVal);
                tableRows.push(rowData);
            }

            doc.autoTable({
                head: headers,
                body: tableRows,
                startY: 22,
                theme: 'grid',
                headStyles: { 
                    fillColor: [44, 62, 80],
                    fontSize: 8, // Font ridotto header
                    halign: 'center',
                    valign: 'middle'
                },
                bodyStyles: {
                    fontSize: 8, // Font ridotto corpo
                    cellPadding: 1, // Padding minimo per risparmiare spazio verticale e orizzontale
                    valign: 'middle'
                },
                columnStyles: {
                    0: { fontStyle: 'bold', cellWidth: 20 }, // Colonna Nome stretta
                    // Le colonne dalla 1 alla 10 (checkbox) le lasciamo automatiche ma centrate
                    1: { halign: 'center' }, 2: { halign: 'center' }, 3: { halign: 'center' },
                    4: { halign: 'center' }, 5: { halign: 'center' }, 6: { halign: 'center' },
                    7: { halign: 'center' }, 8: { halign: 'center' }, 9: { halign: 'center' },
                    10: { halign: 'center' }, // Internet
                    11: { cellWidth: 'auto' } // Note prende lo spazio rimanente
                },
                margin: { top: 20, left: 10, right: 10 } // Margini ridotti
            });

            doc.save('report_aula_' + new Date().toISOString().slice(0,10) + '.pdf');
        }

        // Avvio
        window.onload = () => loadState();

    </script>
</body>
</html>
