<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Audio Client-Side (MP3, WAV, OGG)</title>
    
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.0/dist/ffmpeg.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* Stile per la barra di progresso */
        #progress-bar-fill {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-6 md:p-10 flex flex-col items-center font-sans">

    <div class="w-full max-w-3xl bg-white p-8 rounded-2xl shadow-xl" id="main-card">
        <h1 class="text-3xl font-bold mb-2 text-blue-700 text-center">Convertitore Audio Privato</h1>
        <p class="text-center text-gray-600 mb-8">Nessun server coinvolto. I tuoi file restano sul tuo PC.</p>
        
        <div class="mb-6 p-6 border-2 border-dashed border-gray-300 rounded-xl text-center bg-gray-50 hover:border-blue-400 hover:bg-blue-50 transition cursor-pointer" id="drop-zone">
            <label for="fileInput" class="cursor-pointer block w-full">
                <span class="block text-gray-700 font-semibold mb-2 text-lg">1. Seleziona o trascina un file audio</span>
                <span class="block text-gray-500 mb-4 text-sm">Supporta MP3, WAV, OGG, AAC, M4A, FLAC, etc.</span>
                <input type="file" id="fileInput" accept="audio/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-100 file:text-blue-800 hover:file:bg-blue-200 cursor-pointer mx-auto max-w-xs"/>
            </label>
        </div>

        <div id="controls-area" class="hidden border-t border-gray-200 pt-6">
            <div class="flex flex-col md:flex-row items-center justify-between gap-4 bg-gray-50 p-4 rounded-lg mb-6">
                <span id="file-info" class="font-medium text-gray-800 break-all text-center md:text-left">File: --</span>
                
                <div class="flex items-center gap-2">
                    <label for="formatSelect" class="text-sm font-medium text-gray-700">Converti in:</label>
                    <select id="formatSelect" class="bg-white border border-gray-300 rounded-md px-3 py-1.5 text-sm focus:ring-blue-500 focus:border-blue-500">
                        <option value="mp3">MP3 (Compresso)</option>
                        <option value="wav">WAV (Non compresso)</option>
                        <option value="ogg">OGG Vorbis</option>
                        <option value="aac">AAC</option>
                    </select>
                </div>
            </div>

            <div class="text-center">
                <button id="convertBtn" class="bg-blue-600 text-white px-8 py-3 rounded-full shadow-lg hover:bg-blue-700 transition font-bold text-lg w-full md:w-auto flex items-center justify-center gap-2 mx-auto">
                    🚀 Avvia Conversione Locale
                </button>
            </div>
        </div>

        <div id="status-area" class="hidden mt-8 border-t border-gray-200 pt-6 text-center">
            <p id="status-text" class="text-sm font-medium text-gray-700 mb-4">Inizializzazione motore...</p>
            
            <div class="w-full bg-gray-200 rounded-full h-3 mb-6 relative overflow-hidden">
                <div id="progress-bar-fill" class="bg-blue-600 h-full w-0 rounded-full"></div>
            </div>

            <a id="downloadBtn" class="hidden bg-green-600 text-white px-8 py-3 rounded-full shadow-lg hover:bg-green-700 transition font-bold text-lg items-center justify-center gap-2 mx-auto" download>
                ⬇️ Scarica File Convertito
            </a>
        </div>
    </div>

    <script>
        // Estraiamo le funzioni necessarie dalla libreria globale
        const { createFFmpeg, fetchFile } = FFmpeg;

        // 1. Inizializziamo FFmpeg (con log abilitati per vedere cosa succede in console)
        const ffmpeg = createFFmpeg({ log: true });

        // Elementi DOM
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        const controlsArea = document.getElementById('controls-area');
        const fileInfo = document.getElementById('file-info');
        const formatSelect = document.getElementById('formatSelect');
        const convertBtn = document.getElementById('convertBtn');
        const statusArea = document.getElementById('status-area');
        const statusText = document.getElementById('status-text');
        const progressBarFill = document.getElementById('progress-bar-fill');
        const downloadBtn = document.getElementById('downloadBtn');

        let currentFile = null;

        // Gestione Selezione File
        fileInput.addEventListener('change', handleFileSelect);

        // Gestione Drag & Drop
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-blue-400', 'bg-blue-50'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-blue-400', 'bg-blue-50'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-400', 'bg-blue-50');
            if (e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
                handleFileSelect({ target: fileInput });
            }
        });

        function handleFileSelect(e) {
            currentFile = e.target.files[0];
            if (!currentFile) return;

            // Mostra info file e controlli
            fileInfo.innerText = `File: ${currentFile.name} (${(currentFile.size / 1024 / 1024).toFixed(2)} MB)`;
            controlsArea.classList.remove('hidden');
            statusArea.classList.add('hidden'); // Nascondi stato precedente se c'è
            downloadBtn.classList.add('hidden');
        }

        // --- CORE: Logica di Conversione ---
        convertBtn.addEventListener('click', async () => {
            if (!currentFile) return;

            const targetFormat = formatSelect.value;
            const inputName = currentFile.name;
            // Generiamo il nome di output cambiando l'estensione
            const outputName = inputName.replace(/\.[^/.]+$/, "") + "." + targetFormat;

            // Prepara la UI
            convertBtn.disabled = true;
            convertBtn.classList.add('opacity-50', 'cursor-not-allowed');
            statusArea.classList.remove('hidden');
            downloadBtn.classList.add('hidden');
            progressBarFill.style.width = '0%';
            statusText.innerText = "Caricamento motore audio in corso (la prima volta potrebbe richiedere tempo)...";

            try {
                // 1. Carica il motore FFmpeg se non è già carico
                if (!ffmpeg.isLoaded()) {
                    await ffmpeg.load();
                }

                statusText.innerText = "⏳ Lettura file e preparazione conversione...";

                // 2. Tracciamo il progresso (FFmpeg ci dà un valore da 0 a 1)
                ffmpeg.setProgress(({ ratio }) => {
                    const percentage = Math.round(ratio * 100);
                    progressBarFill.style.width = `${percentage}%`;
                    statusText.innerText = `⏳ Conversione in corso: ${percentage}%`;
                });

                // 3. Scriviamo il file audio nella memoria virtuale di FFmpeg (WASM filesystem)
                ffmpeg.FS('writeFile', inputName, await fetchFile(currentFile));

                statusText.innerText = `⏳ Conversione da ${inputName.split('.').pop().toUpperCase()} a ${targetFormat.toUpperCase()}...`;

                // 4. Eseguiamo il comando FFmpeg
                // Esempio: ffmpeg -i input.wav output.mp3
                await ffmpeg.run('-i', inputName, outputName);

                statusText.innerText = "✅ Conversione completata! Preparazione download...";

                // 5. Leggiamo il file convertito dalla memoria virtuale
                const data = ffmpeg.FS('readFile', outputName);

                // 6. Creiamo un URL scaricabile (Blob) per il browser
                const blob = new Blob([data.buffer], { type: `audio/${targetFormat}` });
                const url = URL.createObjectURL(blob);

                // Configura il pulsante di download
                downloadBtn.href = url;
                downloadBtn.download = outputName;
                downloadBtn.innerText = `⬇️ Scarica ${outputName}`;
                downloadBtn.classList.remove('hidden');
                downloadBtn.classList.add('flex');
                
                statusText.innerText = `✅ File convertito con successo: ${outputName}`;

                // Pulizia della memoria virtuale di FFmpeg
                ffmpeg.FS('unlink', inputName);
                ffmpeg.FS('unlink', outputName);

            } catch (error) {
                console.error(error);
                statusText.innerText = `❌ Errore durante la conversione: ${error.message}`;
                progressBarFill.classList.add('bg-red-600');
            } finally {
                // Ripristina pulsante
                convertBtn.disabled = false;
                convertBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
