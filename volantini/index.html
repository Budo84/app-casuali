<!DOCTYPE html>
<html lang="it">
<head>

    <title>Gestione Volantini AI</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }

        .view { background: #28a745; color: white; }
        .view:hover { background: #218838; }

    <div class="box">

        <a href="https://github.com/USER/REPO/upload/main/volantini/input" target="_blank" class="btn upload">
            📤 1. Carica Nuovo PDF
        </a>
        
        <a href="https://github.com/USER/REPO/blob/main/volantini/output/offerte.json" target="_blank" class="btn view">
