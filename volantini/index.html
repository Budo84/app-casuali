<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Upload Diretto Volantini AI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
        
        h2 { color: #2c3e50; margin-bottom: 20px; }
        
        /* Configurazione iniziale */
        #config-form { display: none; text-align: left; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        
        /* Area Upload */
        #upload-area { display: none; }
        .drop-zone { border: 2px dashed #3498db; padding: 30px; border-radius: 12px; background: #f8fbfe; cursor: pointer; transition: 0.3s; }
        .drop-zone:hover { background: #e1f0fa; border-color: #2980b9; }
        .icon { font-size: 40px; display: block; margin-bottom: 10px; }
        
        /* Bottoni */
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 15px; transition: 0.2s; }
        .btn-save { background: #2c3e50; color: white; }
        .btn-upload { background: #3498db; color: white; }
        .btn-upload:disabled { background: #bdc3c7; cursor: not-allowed; }
        .btn-view { background: #27ae60; color: white; text-decoration: none; display: inline-block; box-sizing: border-box; display: none; }
        
        /* Loading e Status */
        .loader { width: 24px; height: 24px; border: 3px solid #f3f3f3; border-top: 3px solid #3498db; border-radius: 50%; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status-msg { margin-top: 15px; font-size: 14px; min-height: 20px; }

        .settings-link { margin-top: 20px; font-size: 12px; color: #95a5a6; text-decoration: underline; cursor: pointer; display: block; }
    </style>
</head>
<body>

<div class="card">
    <h2>📄 Gestore Volantini</h2>

    <div id="config-form">
        <div class="input-group">
            <label>Username GitHub</label>
            <input type="text" id="gh-user" placeholder="Es. mario-rossi">
        </div>
        <div class="input-group">
            <label>Nome Repository</label>
            <input type="text" id="gh-repo" placeholder="Es. app-volantini">
        </div>
        <div class="input-group">
            <label>Token Personale (PAT)</label>
            <input type="password" id="gh-token" placeholder="Incolla ghp_...">
        </div>
        <button class="btn btn-save" onclick="salvaConfig()">Salva Configurazione</button>
    </div>

    <div id="upload-area">
        <div class="drop-zone" onclick="document.getElementById('file-input').click()">
            <span class="icon">📤</span>
            <span id="file-label">Tocca per scegliere il PDF</span>
            <input type="file" id="file-input" accept="application/pdf" style="display:none" onchange="fileSelezionato()">
        </div>

        <button id="btn-action" class="btn btn-upload" onclick="caricaSuGithub()" disabled>Carica PDF su GitHub</button>
        
        <div class="loader" id="loader"></div>
        <p id="status-msg"></p>

        <a id="btn-json" href="#" target="_blank" class="btn btn-view">
            ✅ Vedi JSON Risultato
        </a>

        <span class="settings-link" onclick="resetConfig()">Modifica impostazioni</span>
    </div>
</div>

<script>
    // --- GESTIONE CONFIGURAZIONE ---
    function init() {
        const user = localStorage.getItem('gh_user');
        const token = localStorage.getItem('gh_token');
        
        if (user && token) {
            mostraUpload();
        } else {
            document.getElementById('config-form').style.display = 'block';
        }
    }

    function salvaConfig() {
        const user = document.getElementById('gh-user').value.trim();
        const repo = document.getElementById('gh-repo').value.trim();
        const token = document.getElementById('gh-token').value.trim();

        if (!user || !repo || !token) {
            alert("Tutti i campi sono obbligatori per connettersi a GitHub!");
            return;
        }

        localStorage.setItem('gh_user', user);
        localStorage.setItem('gh_repo', repo);
        localStorage.setItem('gh_token', token);
        mostraUpload();
    }

    function mostraUpload() {
        document.getElementById('config-form').style.display = 'none';
        document.getElementById('upload-area').style.display = 'block';
        
        // Aggiorna link JSON
        const user = localStorage.getItem('gh_user');
        const repo = localStorage.getItem('gh_repo');
        document.getElementById('btn-json').href = `https://github.com/${user}/${repo}/blob/main/volantini/output/offerte.json`;
    }

    function resetConfig() {
        if(confirm("Vuoi cancellare i dati di accesso salvati?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // --- GESTIONE FILE ---
    function fileSelezionato() {
        const file = document.getElementById('file-input').files[0];
        if (file) {
            document.getElementById('file-label').innerText = file.name;
            document.getElementById('btn-action').disabled = false;
            document.getElementById('btn-action').style.background = "#2ecc71"; // Verde pronto
        }
    }

    // --- CARICAMENTO REALE SU GITHUB (API) ---
    function caricaSuGithub() {
        const file = document.getElementById('file-input').files[0];
        if (!file) return;

        const user = localStorage.getItem('gh_user');
        const repo = localStorage.getItem('gh_repo');
        const token = localStorage.getItem('gh_token');

        // UI Loading
        document.getElementById('btn-action').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('status-msg').innerText = "Lettura file...";
        document.getElementById('status-msg').style.color = "#666";

        const reader = new FileReader();
        reader.readAsDataURL(file); // Legge il file come stringa Base64

        reader.onload = async function() {
            const base64Content = reader.result.split(',')[1]; // Rimuove intestazione 'data:...'
            
            // Crea nome file unico per evitare sovrascritture o errori
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const fileName = `volantino_${timestamp}.pdf`;
            
            // 🎯 PUNTO CRUCIALE: Percorso esatto nella repo
            const apiUrl = `https://api.github.com/repos/${user}/${repo}/contents/volantini/input/${fileName}`;

            document.getElementById('status-msg').innerText = "Invio a GitHub...";

            try {
                const response = await fetch(apiUrl, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `Upload automatico: ${file.name}`,
                        content: base64Content
                    })
                });

                if (response.ok) {
                    document.getElementById('status-msg').innerText = "✅ Caricato! L'AI sta elaborando...";
                    document.getElementById('status-msg').style.color = "green";
                    document.getElementById('loader').style.display = 'none';
                    document.getElementById('btn-json').style.display = 'block'; // Mostra bottone risultato
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.message);
                }
            } catch (err) {
                document.getElementById('status-msg').innerText = "❌ Errore: " + err.message;
                document.getElementById('status-msg').style.color = "red";
                document.getElementById('loader').style.display = 'none';
                document.getElementById('btn-action').style.display = 'block'; // Riapri bottone
            }
        };
    }

    // Avvio
    init();
</script>

</body>
</html>
