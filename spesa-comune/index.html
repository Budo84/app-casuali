<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Spesa Condivisa</title>
    <style>
        :root {
            --primary: #4CAF50;
            --bg: #f9f9f9;
            --text: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: #e9ecef;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 600px;
            background: white;
            margin: 0 auto;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: var(--primary);
        }
        .section {
            margin-bottom: 25px;
            padding: 15px;
            background: var(--bg);
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        h2 {
            font-size: 1.2em;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 5px;
            margin-top: 0;
        }
        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .row:last-child { border-bottom: none; }
        .crossed {
            text-decoration: line-through;
            color: #888;
        }
        input[type="text"], input[type="number"], textarea {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            flex: 1;
            margin-right: 10px;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            min-height: 40px;
        }
        input[type="number"] { max-width: 100px; }
        button {
            padding: 8px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            height: 100%;
        }
        button:hover { background: #45a049; }
        .btn-danger {
            background: #f44336;
            padding: 5px 10px;
        }
        .btn-danger:hover { background: #e53935; }
        .input-group { display: flex; align-items: flex-start; margin-top: 15px; }
        .credit { color: #2e7d32; }
        .debt { color: #d32f2f; }
        .transfer-box {
            background: #fff3e0;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border-left: 4px solid #ff9800;
        }
        .summary-box {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .btn-whatsapp {
            background: #25D366;
            width: 100%;
            font-size: 1.1em;
            padding: 12px;
            margin-top: 15px;
        }
        .btn-whatsapp:hover {
            background: #128C7E;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Spesa Condivisa 🛒</h1>

    <div class="section">
        <h2>1. Lista della Spesa</h2>
        <div id="shopping-list"></div>
        <div class="input-group">
            <textarea id="new-item" rows="2" placeholder="Scrivi o incolla qui la tua lista..."></textarea>
            <button onclick="addItem()" style="padding: 12px;">Aggiungi</button>
        </div>
        <small style="color: #666; margin-top: 5px; display: block;">Puoi separare i prodotti con una virgola oppure <strong>incollare una lista con gli elementi uno sotto l'altro</strong>.</small>
    </div>

    <div class="section">
        <h2>2. Chi ha speso e quanto?</h2>
        <div id="families-list"></div>
        <div class="input-group">
            <input type="text" id="new-family" placeholder="Nome della famiglia/persona">
            <button onclick="addFamily()">Aggiungi</button>
        </div>
    </div>

    <div class="section">
        <h2>3. Divisione Spese</h2>
        <button style="width: 100%; font-size: 1.1em; padding: 12px;" onclick="calculateTotals()">Calcola i Conti 🧮</button>
        <div id="summary-results"></div>
    </div>
</div>

<script>
    let items = [];
    let families = [];
    let whatsappText = ""; // Salveremo qui il testo per WhatsApp

    // --- LOGICA LISTA DELLA SPESA ---
    function renderList() {
        const list = document.getElementById('shopping-list');
        list.innerHTML = '';
        items.forEach((item, index) => {
            list.innerHTML += `
                <div class="row">
                    <label style="cursor: pointer; display: flex; align-items: center; width: 100%; word-break: break-word;">
                        <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleItem(${index})" style="margin-right: 10px; transform: scale(1.2); flex-shrink: 0;">
                        <span class="${item.checked ? 'crossed' : ''}">${item.name}</span>
                    </label>
                    <button class="btn-danger" style="margin-left: 10px;" onclick="removeItem(${index})">X</button>
                </div>
            `;
        });
    }

    function addItem() {
        const input = document.getElementById('new-item');
        const value = input.value;
        
        if (value.trim() !== '') {
            const newItemsArray = value.split(/[,\n]+/);
            newItemsArray.forEach(itemName => {
                const cleanName = itemName.trim();
                if (cleanName !== '') {
                    items.push({ name: cleanName, checked: false });
                }
            });
            input.value = '';
            renderList();
        }
    }

    function toggleItem(index) {
        items[index].checked = !items[index].checked;
        renderList();
    }

    function removeItem(index) {
        items.splice(index, 1);
        renderList();
    }

    // --- LOGICA FAMIGLIE E SPESE ---
    function renderFamilies() {
        const list = document.getElementById('families-list');
        list.innerHTML = '';
        families.forEach((fam, index) => {
            list.innerHTML += `
                <div class="row">
                    <strong>${fam.name}</strong>
                    <div style="display: flex; align-items: center;">
                        € <input type="number" step="0.01" min="0" value="${fam.spent}" onchange="updateSpent(${index}, this.value)" placeholder="0.00">
                        <button class="btn-danger" onclick="removeFamily(${index})">X</button>
                    </div>
                </div>
            `;
        });
    }

    function addFamily() {
        const input = document.getElementById('new-family');
        if (input.value.trim() !== '') {
            families.push({ name: input.value.trim(), spent: 0 });
            input.value = '';
            renderFamilies();
        }
    }

    function updateSpent(index, amount) {
        families[index].spent = parseFloat(amount) || 0;
    }

    function removeFamily(index) {
        families.splice(index, 1);
        renderFamilies();
    }

    // --- LOGICA CALCOLI ---
    function calculateTotals() {
        const resultsDiv = document.getElementById('summary-results');
        
        if (families.length === 0) {
            resultsDiv.innerHTML = '<p class="debt">Aggiungi almeno una famiglia per fare i conti!</p>';
            return;
        }

        let totalSpent = families.reduce((sum, fam) => sum + fam.spent, 0);
        let quota = totalSpent / families.length;

        // Inizio a preparare sia l'HTML (per lo schermo) sia il Testo (per WhatsApp)
        whatsappText = "🛒 *RESOCONTO SPESA CONDIVISA* 🛒\n\n";
        whatsappText += `💰 *Spesa Totale:* €${totalSpent.toFixed(2)}\n`;
        whatsappText += `🎯 *Quota a famiglia:* €${quota.toFixed(2)}\n\n`;
        whatsappText += `📊 *BILANCIO:*\n`;

        let html = `
            <div class="summary-box">
                <p><strong>Spesa Totale:</strong> €${totalSpent.toFixed(2)}</p>
                <p><strong>Quota divisa per famiglia:</strong> €${quota.toFixed(2)}</p>
                <hr style="border: 0; border-top: 1px solid #ccc; margin: 15px 0;">
                <h3>Bilancio di ognuno:</h3>
        `;

        let debtors = [];
        let creditors = [];

        families.forEach(fam => {
            let balance = fam.spent - quota;
            
            html += `<p style="margin-bottom: 10px;"><strong>${fam.name}</strong> ha pagato €${fam.spent.toFixed(2)}.<br>`;
            whatsappText += `- *${fam.name}* ha pagato €${fam.spent.toFixed(2)} `;
            
            if (balance > 0.01) {
                html += `<span class="credit">→ Deve riprendere €${balance.toFixed(2)}</span></p>`;
                whatsappText += `(Deve riprendere €${balance.toFixed(2)})\n`;
                creditors.push({ name: fam.name, amount: balance });
            } else if (balance < -0.01) {
                html += `<span class="debt">→ Deve versare €${Math.abs(balance).toFixed(2)}</span></p>`;
                whatsappText += `(Deve versare €${Math.abs(balance).toFixed(2)})\n`;
                debtors.push({ name: fam.name, amount: Math.abs(balance) });
            } else {
                html += `<span style="color: #666;">→ È perfettamente in pari!</span></p>`;
                whatsappText += `(È in pari!)\n`;
            }
        });

        html += `</div>`;

        // CALCOLO DI CHI DEVE PAGARE CHI
        if (debtors.length > 0 && creditors.length > 0) {
            html += `
                <div class="transfer-box">
                    <h3 style="margin-top: 0; color: #e65100;">💸 Come saldare i conti:</h3>
                    <ul style="padding-left: 20px; margin-bottom: 0;">
            `;
            
            whatsappText += `\n💸 *COME SALDARE I CONTI:*\n`;

            let i = 0; 
            let j = 0; 

            while (i < debtors.length && j < creditors.length) {
                let debtor = debtors[i];
                let creditor = creditors[j];

                let amount = Math.min(debtor.amount, creditor.amount);

                if (amount > 0.01) {
                    html += `<li><strong>${debtor.name}</strong> deve dare <strong>€${amount.toFixed(2)}</strong> a <strong>${creditor.name}</strong></li>`;
                    whatsappText += `👉 *${debtor.name}* deve dare *€${amount.toFixed(2)}* a *${creditor.name}*\n`;
                }

                debtor.amount -= amount;
                creditor.amount -= amount;

                if (debtor.amount < 0.01) i++;
                if (creditor.amount < 0.01) j++;
            }

            html += `</ul></div>`;
        }

        // Aggiungo il pulsante WhatsApp all'HTML
        html += `<button class="btn-whatsapp" onclick="shareOnWhatsApp()">Invia su WhatsApp 💬</button>`;

        resultsDiv.innerHTML = html;
    }

    // Funzione per inviare il messaggio
    function shareOnWhatsApp() {
        // encodeURIComponent trasforma gli spazi e i "a capo" in modo che WhatsApp li legga correttamente
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(whatsappText)}`;
        window.open(url, '_blank');
    }

    document.getElementById("new-item").addEventListener("keypress", function(event) {
        if (event.key === "Enter" && !event.shiftKey) {
            event.preventDefault();
            addItem();
        }
    });
    
    document.getElementById("new-family").addEventListener("keypress", function(event) {
        if (event.key === "Enter") addFamily();
    });
</script>

</body>
</html>
