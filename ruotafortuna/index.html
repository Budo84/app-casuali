<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>La Ruota v8 (TV Edition)</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <style>
        /* --- RESET --- */
        * { box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
        body {
            margin: 0; padding: 0;
            background: #121212; color: white;
            font-family: 'Segoe UI', system-ui, sans-serif;
            /* MODIFICA: Abilitato lo scroll verticale */
            min-height: 100vh; 
            width: 100vw;
            overflow-y: auto; /* Permette lo scroll */
            overflow-x: hidden;
        }

        /* --- LAYOUT GRID --- */
        .main-layout {
            display: flex; flex-direction: column; 
            /* MODIFICA: Altezza minima per permettere lo scroll */
            min-height: 100vh; 
            padding: 10px; gap: 10px;
        }
        @media (min-width: 768px) {
            .main-layout { flex-direction: row; height: 100vh; overflow: hidden; } /* Su PC blocchiamo lo scroll se non serve */
            .stage-area { flex: 2.8; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
            .sidebar-area { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 320px; }
        }

        /* --- TABELLONE TV (GRID SYSTEM) --- */
        .board-container {
            flex: 1; background: #222; border-radius: 15px; border: 4px solid #333;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 10px; gap: 5px;
            box-shadow: inset 0 0 30px black;
            min-height: 200px; /* Altezza minima per evitare schiacciamenti */
        }

        .board-row { display: flex; gap: 4px; justify-content: center; }
        
        .tile {
            width: 32px; height: 42px; /* Dimensione base */
            background: #009688; /* Verde tabellone vuoto */
            border: 1px solid #fff;
            display: flex; justify-content: center; align-items: center;
            font-size: 24px; font-weight: 800; color: transparent;
            border-radius: 4px; transition: transform 0.4s;
        }
        
        /* Tipi di caselle */
        .tile.void { visibility: hidden; } /* Spazio fuori griglia */
        .tile.active { background: white; border: 2px solid #ccc; } /* Casella usata (bianca) */
        .tile.hidden { background: white; color: transparent; } /* Lettera nascosta */
        .tile.revealed { background: white; color: black; animation: flip 0.6s forwards; } /* Lettera svelata */
        .tile.empty { background: #00796b; border: 1px solid #004d40; } /* Casella verde vuota */

        @keyframes flip { 0% { transform: rotateY(0); } 50% { transform: rotateY(90deg); background: #ffeb3b; } 100% { transform: rotateY(0); } }

        /* Responsive tiles */
        @media (min-width: 1024px) { .tile { width: 45px; height: 60px; font-size: 32px; } }
        @media (max-width: 600px) { .tile { width: 18px; height: 26px; font-size: 14px; gap: 2px; } }

        /* --- INDIZIO (HINT) --- */
        .hint-bar {
            background: linear-gradient(90deg, #1565C0, #0D47A1);
            color: white; text-align: center; padding: 10px;
            border-radius: 8px; font-size: 1.2rem; font-weight: bold;
            letter-spacing: 2px; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid #42a5f5;
        }

        /* --- STATUS BAR --- */
        .status-bar {
            background: #1e1e1e; padding: 10px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border-left: 5px solid #ffeb3b;
        }
        .msg-text { font-size: 1rem; color: #ddd; }
        .val-text { font-size: 1.4rem; font-weight: bold; color: #ffeb3b; }

        /* --- GIOCATORI --- */
        .players-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; height: 85px; flex-shrink: 0; }
        .player-card {
            flex: 1; background: #333; border-radius: 10px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            min-width: 100px; border: 2px solid transparent; opacity: 0.6; transition: 0.3s;
        }
        .player-card.active {
            background: #2e2e2e; border-color: #00e676; opacity: 1;
            transform: translateY(-5px); box-shadow: 0 0 15px #00e676;
        }
        .p-name { font-size: 0.8rem; color: #aaa; text-transform: uppercase; }
        .p-score { font-size: 1.3rem; font-weight: bold; color: white; }
        .active .p-score { color: #00e676; }

        /* --- SIDEBAR (RUOTA + TASTI) --- */
        .wheel-panel {
            flex: 1; background: #1e1e1e; border-radius: 15px; position: relative;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            min-height: 250px;
        }
        canvas { max-width: 95%; max-height: 95%; object-fit: contain; }
        .pointer {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            width: 0; height: 0; border-top: 20px solid transparent; border-bottom: 20px solid transparent;
            border-right: 40px solid white; z-index: 10;
        }

        .controls-panel {
            flex: 1; background: #1e1e1e; border-radius: 15px; padding: 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .btn-row { display: flex; gap: 8px; height: 50px; }
        button { border: none; border-radius: 8px; font-weight: bold; font-size: 0.9rem; cursor: pointer; color: black; flex: 1; }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .btn-spin { flex: 2; background: #00e676; }
        .btn-vowel { background: #7c4dff; color: white; }
        .btn-solve { background: #ff1744; color: white; }

        .keyboard { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; align-content: center; height: auto; min-height: 150px; }
        .key { width: 36px; height: 40px; background: #444; color: white; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; cursor: pointer; }
        .key.used { background: #222; color: #555; }
        .key.active-hint { background: #00e676; color: black; box-shadow: 0 0 8px #00e676; }
        
        /* Stile per le vocali sulla tastiera: le rendiamo più scure/spente */
        .key.is-vowel {
            background-color: #222; /* Molto scuro */
            color: #555;            /* Testo grigio scuro */
            border: 1px solid #333;
            opacity: 0.5;           /* Semitrasparente */
        }

        /* --- MODALS & OVERLAYS --- */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .modal-box { background: #333; padding: 20px; border-radius: 12px; width: 90%; max-width: 450px; text-align: center; color: white; border: 1px solid #555; }
        textarea, input { width: 100%; background: #222; border: 1px solid #555; color: white; padding: 10px; margin: 10px 0; border-radius: 5px; }

        /* Victory Animation */
        #confettiCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 300; display: none; }
        .win-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 250;
            display: none; flex-direction: column; justify-content: center; align-items: center;
        }
        .win-text { font-size: 3rem; color: #FFD700; font-weight: bold; text-shadow: 0 0 20px #FFD700; animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); text-align: center; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
    </style>
</head>
<body>

<div class="main-layout">
    <div class="stage-area">
        
        <div class="board-container" id="boardGrid">
            </div>

        <div class="hint-bar" id="hintText">CATEGORIA</div>

        <div class="status-bar">
            <span id="msg" class="msg-text">Pronti a giocare?</span>
            <span id="currentVal" class="val-text"></span>
        </div>

        <div class="players-strip" id="playersBar"></div>
    </div>

    <div class="sidebar-area">
        <div class="wheel-panel" id="wheelContainer">
            <div class="pointer"></div>
            <canvas id="wheelCanvas"></canvas>
        </div>

        <div class="controls-panel">
            <div class="btn-row">
                <button class="btn-spin" id="btnSpin" onclick="spin()">GIRA</button>
                <button class="btn-vowel" id="btnVowel" onclick="buyVowel()">VOCALE</button>
                <button class="btn-solve" onclick="trySolve()">SOLUZIONE</button>
            </div>
            <div class="keyboard" id="keyboard"></div>
            <div style="text-align: center; margin-top: auto; padding: 10px;">
                <button onclick="openSettings()" style="background:transparent; color:#666; font-size:0.8rem;">⚙️ IMPOSTAZIONI (FRASI/NOMI)</button>
            </div>
        </div>
    </div>
</div>

<div id="setupModal" class="modal" style="display: flex;">
    <div class="modal-box">
        <h2 style="color:#00e676;">CHI GIOCA?</h2>
        <textarea id="playerNamesInput" rows="4" placeholder="Nomi giocatori...">GIOCATORE 1&#10;GIOCATORE 2&#10;GIOCATORE 3</textarea>
        <button onclick="startGame()" style="background: #00e676; width: 100%; padding:15px; font-weight:bold;">INIZIA PARTITA</button>
    </div>
</div>

<div id="settingsModal" class="modal">
    <div class="modal-box">
        <h3>MODIFICA PUZZLE</h3>
        <p style="font-size:0.8rem; color:#aaa;">Formato: FRASE | INDIZIO</p>
        <textarea id="phrasesInput" rows="8" placeholder="ROMA ANTICA|GEOGRAFIA"></textarea>
        <button onclick="savePhrases()" style="background: #00e676; width: 100%; padding:10px;">SALVA</button>
        <button onclick="closeSettings()" style="background: #444; width: 100%; padding:10px; margin-top:5px; color:white;">CHIUDI</button>
    </div>
</div>

<div id="winOverlay" class="win-overlay">
    <div class="win-text" id="winMessage">VITTORIA!</div>
    <div style="font-size: 1.5rem; color: white; margin-top: 10px;" id="winSub"></div>
    
    <div style="display: flex; gap: 20px; margin-top: 40px; flex-wrap: wrap; justify-content: center;">
        
        <button onclick="nextRound()" style="background: #00e676; padding: 15px 30px; font-size: 1.2rem; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; color: black; box-shadow: 0 0 15px rgba(0,230,118,0.4);">
            CONTINUA TORNEO ➡️
            <div style="font-size:0.8rem; font-weight:normal; margin-top:5px;">(Mantieni i soldi vinti)</div>
        </button>
        
        <button onclick="fullReset()" style="background: #ff1744; color: white; padding: 15px 30px; font-size: 1.2rem; border-radius: 10px; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 0 15px rgba(255,23,68,0.4);">
            NUOVA PARTITA 🔄
            <div style="font-size:0.8rem; font-weight:normal; margin-top:5px;">(Azzera tutti i punteggi)</div>
        </button>

    </div>
</div>
<canvas id="confettiCanvas"></canvas>

<script>
    // --- DATI ---
    let players = [];
    let currentPlayerIndex = 0;
    
    // Struttura Oggetti: { text: "FRASE", hint: "INDIZIO" }
    let defaultPuzzles = [
        { text: "LA DOLCE VITA", hint: "CINEMA ITALIANO" },
        { text: "PIZZA MARGHERITA", hint: "CUCINA" },
        { text: "IL COLOSSEO", hint: "MONUMENTI" },
        { text: "NEL BLU DIPINTO DI BLU", hint: "MUSICA" },
        { text: "DIVINA COMMEDIA", hint: "LETTERATURA" }
    ];
    let puzzles = [...defaultPuzzles];
    let currentPuzzle = {};
    
    // --- CANVAS RUOTA ---
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    
    // NUOVA LISTA SEGMENTI (10 Spicchi)
    const segments = [
        { label: "100", val: 100, color: "#e53935" },   // Rosso
        { label: "500", val: 500, color: "#43a047" },   // Verde
        { label: "PERDI", val: -1, color: "#ffffff", text: "black" }, // Bianco
        { label: "250", val: 250, color: "#fb8c00" },   // Arancio (NUOVO)
        { label: "1000", val: 1000, color: "#d81b60" }, // Rosa scuro
        { label: "BANK", val: 0, color: "#000000", text: "white" }, // Nero
        { label: "750", val: 750, color: "#8e24aa" },   // Viola (NUOVO)
        { label: "JOLLY", val: 999, color: "#fdd835", text: "black" }, // Oro
        { label: "200", val: 200, color: "#039be5" },   // Azzurro
        { label: "150", val: 150, color: "#7cb342" }    // Verde chiaro (NUOVO)
    ];

    let angle = 0;
    let isSpinning = false;
    let waitingForConsonant = false;
    let turnValue = 0;

    // --- INIT ---
    function init() {
        if(localStorage.getItem('v8_puzzles')) {
            puzzles = JSON.parse(localStorage.getItem('v8_puzzles'));
        }
        window.addEventListener('resize', resizeWheel);
        setTimeout(resizeWheel, 100);
        generateKeyboard();
    }
    
    function resizeWheel() {
        const c = document.getElementById('wheelContainer');
        const s = Math.min(c.clientWidth, c.clientHeight) - 20;
        if(s>0) { canvas.width=s; canvas.height=s; drawWheel(); }
    }

    // --- LOGICA GIOCO ---
    function startGame() {
        const raw = document.getElementById('playerNamesInput').value;
        const names = raw.split('\n').map(n=>n.trim()).filter(n=>n.length>0);
        if(names.length===0) { alert("Nomi mancanti!"); return; }
        
        players = names.map(n => ({ name: n.toUpperCase(), score: 0 }));
        currentPlayerIndex = 0;
        document.getElementById('setupModal').style.display='none';
        renderPlayers();
        newRound();
        setTimeout(resizeWheel, 200);
    }

    function renderPlayers() {
        const bar = document.getElementById('playersBar');
        bar.innerHTML = '';
        players.forEach((p, i) => {
            const div = document.createElement('div');
            div.className = `player-card ${i===currentPlayerIndex?'active':''}`;
            div.innerHTML = `<div class="p-name">${p.name}</div><div class="p-score">${p.score}</div>`;
            bar.appendChild(div);
        });
    }

    function nextTurn() {
        waitingForConsonant = false; highlightKeyboard(false);
        currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        renderPlayers();
        message(`Tocca a ${players[currentPlayerIndex].name}`);
        enableSpin(true);
    }

    function newRound() {
        currentPuzzle = puzzles[Math.floor(Math.random() * puzzles.length)];
        waitingForConsonant = false; isSpinning = false;
        
        // Reset tastiera
        document.querySelectorAll('.key').forEach(k=>{ k.disabled=false; k.classList.remove('used','active-hint'); k.style.background="#444"; k.style.opacity="1"; k.style.cursor="pointer"; });
        
        drawBoardTV(currentPuzzle.text);
        document.getElementById('hintText').innerText = currentPuzzle.hint;
        
        renderPlayers();
        message(`Nuova Manche: ${players[currentPlayerIndex].name}`);
        enableSpin(true);
        generateKeyboard(); // Rigenera per resettare le classi vocali corrette
    }

    // --- IL NUOVO TABELLONE TV (12-14-14-12) ---
    function drawBoardTV(text) {
        const grid = document.getElementById('boardGrid');
        grid.innerHTML = '';
        
        // Struttura righe fisse
        const rowCaps = [12, 14, 14, 12];
        const words = text.split(' ');
        let rowsContent = [[], [], [], []]; // Contenuto per riga
        
        let currentRow = 0;
        let currentLen = 0;
        
        // Algoritmo riempimento righe
        words.forEach(word => {
            if(currentRow > 3) return; // Frase troppo lunga
            
            // Se la parola ci sta nella riga attuale (+1 per spazio)
            if (currentLen + word.length <= rowCaps[currentRow]) {
                if (currentLen > 0) { rowsContent[currentRow].push(' '); currentLen++; } // Aggiungi spazio
                for(let c of word) rowsContent[currentRow].push(c);
                currentLen += word.length;
            } else {
                // Vai a capo
                currentRow++;
                currentLen = 0;
                if(currentRow > 3) return;
                for(let c of word) rowsContent[currentRow].push(c);
                currentLen += word.length;
            }
        });

        // Disegno HTML
        rowCaps.forEach((cap, rIdx) => {
            const rowDiv = document.createElement('div');
            rowDiv.className = 'board-row';
            
            const content = rowsContent[rIdx];
            const emptySpaces = cap - content.length;
            const padLeft = Math.floor(emptySpaces / 2); // Centratura
            
            for(let i=0; i<cap; i++) {
                const tile = document.createElement('div');
                tile.className = 'tile empty'; // Default verde
                
                // Se siamo nell'area del testo
                if (i >= padLeft && i < padLeft + content.length) {
                    const char = content[i - padLeft];
                    if (char !== ' ') {
                        tile.className = 'tile hidden letter-tile';
                        tile.dataset.char = char;
                        tile.innerText = char;
                    }
                }
                rowDiv.appendChild(tile);
            }
            grid.appendChild(rowDiv);
        });
    }

    // --- GIOCO ---
    function spin() {
        if(isSpinning || waitingForConsonant) return;
        isSpinning = true; enableSpin(false); message("Gira...");
        let vel = Math.random() * 20 + 20;
        function anim() {
            vel *= 0.97; angle += vel * 0.01; drawWheel();
            if(vel>0.1) requestAnimationFrame(anim);
            else { isSpinning=false; processResult(); }
        }
        anim();
    }

    function processResult() {
        const PI2 = Math.PI*2;
        const idx = Math.floor((PI2 - (angle%PI2)) / (PI2/segments.length)) % segments.length;
        const res = segments[idx];
        turnValue = res.val;
        document.getElementById('currentVal').innerText = res.label;

        if(turnValue === 0) { message("BANCAROTTA!"); players[currentPlayerIndex].score=0; renderPlayers(); setTimeout(nextTurn, 2000); }
        else if(turnValue === -1) { message("PERDI TURNO"); setTimeout(nextTurn, 2000); }
        else { message(`Vale ${res.label}. Scegli Consonante.`); waitingForConsonant=true; highlightKeyboard(true); }
    }

    function handleKey(char, btn) {
        if(!waitingForConsonant) return;
        if(['A','E','I','O','U'].includes(char)) { alert("Solo consonanti!"); return; }
        
        btn.classList.add('used'); btn.style.background="#222";
        const tiles = document.querySelectorAll(`.letter-tile[data-char="${char}"]`);
        
        if(tiles.length>0) {
            tiles.forEach(t => { t.classList.remove('hidden'); t.classList.add('revealed'); });
            let val = (turnValue===999)?500:turnValue;
            players[currentPlayerIndex].score += (val*tiles.length);
            renderPlayers();
            message(`Trovate ${tiles.length}! Gira ancora.`);
            waitingForConsonant=false; enableSpin(true); highlightKeyboard(false);
            checkWin();
        } else {
            message("Lettera assente."); setTimeout(nextTurn, 1500);
        }
    }

    function buyVowel() {
        if(isSpinning) return;
        if(players[currentPlayerIndex].score < 1000) { alert("Servono 1000€"); return; }
        let c = prompt("Vocale (A,E,I,O,U):"); if(!c) return; c=c.toUpperCase();
        if(!['A','E','I','O','U'].includes(c)) { alert("Non è vocale"); return; }
        
        const btn = document.getElementById('key-'+c);
        if(btn.classList.contains('used')) return;
        
        players[currentPlayerIndex].score -= 1000;
        btn.classList.add('used');
        
        const tiles = document.querySelectorAll(`.letter-tile[data-char="${c}"]`);
        if(tiles.length>0) {
            tiles.forEach(t => { t.classList.remove('hidden'); t.classList.add('revealed'); });
            renderPlayers(); message("Vocale trovata! Gira ancora."); checkWin();
        } else {
            message("Vocale assente.");
        }
    }

    function trySolve() {
        let sol = prompt("Soluzione:"); if(!sol) return;
        if(sol.toUpperCase() === currentPuzzle.text) {
            players[currentPlayerIndex].score += 2000;
            document.querySelectorAll('.letter-tile').forEach(t=>{ t.classList.remove('hidden'); t.classList.add('revealed'); });
            renderPlayers();
            showWinAnimation();
        } else {
            alert("Sbagliato!"); nextTurn();
        }
    }

    function checkWin() {
        if(document.querySelectorAll('.letter-tile.hidden').length === 0) showWinAnimation();
    }

    // --- ANIMAZIONE VITTORIA ---
    function showWinAnimation() {
        const overlay = document.getElementById('winOverlay');
        const msg = document.getElementById('winMessage');
        const sub = document.getElementById('winSub');
        
        msg.innerText = `VINCE ${players[currentPlayerIndex].name}!`;
        sub.innerText = `Totale: ${players[currentPlayerIndex].score} €`;
        
        overlay.style.display = 'flex';
        startConfetti();
    }

    // --- GESTIONE FINE PARTITA ---

    // Opzione 1: Prossimo Round (Mantiene i punteggi accumulati)
    function nextRound() {
        document.getElementById('winOverlay').style.display = 'none';
        stopConfetti(); // Ferma i coriandoli
        newRound();     // Carica una nuova frase
    }

    // Opzione 2: Reset Totale (Azzera i punteggi e riparte)
    function fullReset() {
        if(confirm("Sei sicuro? Questo cancellerà i soldi di tutti i giocatori.")) {
            document.getElementById('winOverlay').style.display = 'none';
            stopConfetti();
            
            // Azzera i punteggi di tutti i giocatori
            players.forEach(p => p.score = 0);
            
            // Il turno torna al primo giocatore della lista
            currentPlayerIndex = 0;
            
            // Aggiorna la grafica dei punteggi a zero
            renderPlayers();
            
            // Avvia una nuova frase
            newRound();
        }
    }

    // --- CONFETTI SYSTEM (Semplice JS) ---
    let confettiInterval;
    function startConfetti() {
        const c = document.getElementById('confettiCanvas');
        c.style.display = 'block';
        c.width = window.innerWidth; c.height = window.innerHeight;
        const ctxC = c.getContext('2d');
        const pieces = [];
        const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];
        
        for(let i=0; i<200; i++) {
            pieces.push({
                x: Math.random()*c.width, y: Math.random()*c.height - c.height,
                w: Math.random()*10+5, h: Math.random()*10+5,
                c: colors[Math.floor(Math.random()*colors.length)],
                s: Math.random()*5+2
            });
        }
        
        confettiInterval = setInterval(() => {
            ctxC.clearRect(0,0,c.width,c.height);
            pieces.forEach(p => {
                p.y += p.s;
                if(p.y > c.height) p.y = -20;
                ctxC.fillStyle = p.c;
                ctxC.fillRect(p.x, p.y, p.w, p.h);
            });
        }, 20);
    }
    function stopConfetti() {
        clearInterval(confettiInterval);
        document.getElementById('confettiCanvas').style.display = 'none';
    }

    // --- UTILS ---
    function drawWheel() {
        const r = canvas.width/2; const arc = (Math.PI*2)/segments.length;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.translate(r,r); ctx.rotate(angle);
        segments.forEach((s,i) => {
            ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,i*arc,i*arc+arc); ctx.fillStyle=s.color; ctx.fill();
            ctx.save(); ctx.rotate(i*arc+arc/2); ctx.textAlign="right"; ctx.fillStyle=s.text||"white";
            ctx.font="bold "+(r/10)+"px Arial"; ctx.fillText(s.label, r-10, 5); ctx.restore();
        });
        ctx.rotate(-angle); ctx.translate(-r,-r);
        ctx.beginPath(); ctx.arc(r,r,r/6,0,Math.PI*2); ctx.fillStyle="white"; ctx.fill();
    }

    function generateKeyboard() {
        const k = document.getElementById('keyboard'); k.innerHTML='';
        // AGGIUNTE LETTERE MANCANTI (J, K, W, X, Y)
        "ABCDEFGHILMNOPQRSTUVZJKWXY".split('').forEach(c=>{
            const b=document.createElement('div'); b.className='key'; b.innerText=c; b.id='key-'+c;
            
            // MODIFICA: Se è una vocale, aggiungiamo una classe speciale
            if(['A','E','I','O','U'].includes(c)) {
                b.classList.add('is-vowel');
            }

            b.onclick=()=>handleKey(c,b); k.appendChild(b);
        });
    }

    function enableSpin(on) { document.getElementById('btnSpin').disabled=!on; }
    
    function highlightKeyboard(on) { 
        document.querySelectorAll('.key').forEach(k=>{ 
            if(k.classList.contains('used')) return;

            // Logica per le vocali
            if(['A','E','I','O','U'].includes(k.innerText)) {
                k.style.opacity = "0.3"; 
                k.style.cursor = "default";
            } else {
                // Logica per le Consonanti
                if(on) {
                    k.classList.add('active-hint'); 
                    k.style.opacity = "1";
                } else {
                    k.classList.remove('active-hint');
                    k.style.opacity = "1";
                }
            }
        }); 
    }
    
    function message(t) { document.getElementById('msg').innerText=t; }

    // Settings
    function openSettings() {
        const text = puzzles.map(p => `${p.text}|${p.hint}`).join('\n');
        document.getElementById('phrasesInput').value = text;
        document.getElementById('settingsModal').style.display='flex';
    }
    function savePhrases() {
        const raw = document.getElementById('phrasesInput').value;
        const newP = raw.split('\n').map(r => {
            const [t, h] = r.split('|');
            if(t && h) return { text: t.trim().toUpperCase(), hint: h.trim().toUpperCase() };
            return null;
        }).filter(x=>x);
        
        if(newP.length>0) {
            puzzles = newP;
            localStorage.setItem('v8_puzzles', JSON.stringify(puzzles));
            closeSettings(); alert("Salvati!"); newRound();
        }
    }
    function closeSettings() { document.getElementById('settingsModal').style.display='none'; }

    init();
</script>
</body>
</html>
