<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP-CASUALI</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            /* Uso min-height invece di height per evitare che i bottoni escano dallo schermo su display piccoli */
            min-height: 100vh; 
            background: #333; 
            color: white; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        
        h1 { 
            margin-bottom: 30px; 
            text-align: center;
        }

        /* --- NUOVO CONTENITORE PER I BOTTONI --- */
        .bottoni-container {
            display: flex;
            flex-wrap: wrap; /* Permette ai bottoni di andare a capo se non c'è spazio */
            justify-content: center; /* Centra i bottoni orizzontalmente */
            gap: 20px; /* Sostituisce il margin dei singoli bottoni, creando spazio uniforme */
            max-width: 900px; /* Limita la larghezza massima per fare un bell'effetto "blocco" */
        }

        .btn {
            background: white; 
            color: #333; 
            text-decoration: none;
            padding: 20px 20px; /* Ridotto un po' il padding laterale per uniformità */
            border-radius: 10px;
            font-size: 1.2rem; 
            font-weight: bold; 
            width: 200px; 
            text-align: center;
            display: block; 
            box-shadow: 0 4px 0 #ccc; 
            transition: transform 0.1s;
        }

        .btn:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        /* Colori dei bottoni */
        .btn-rosso { 
            background: #e74c3c; 
            color: white; 
            box-shadow: 0 4px 0 #c0392b; 
        }
    </style>
</head>
<body>

    <h1>APP-CASUALI</h1>

    <div class="bottoni-container">
        <a href="pizza/index.html" class="btn btn-rosso">🍕 Pizze</a>
        <a href="spesa/index.html" class="btn btn-rosso">👨‍👩‍👧‍👦 FamilyMenu</a>
        <a href="ruotafortuna/index.html" class="btn btn-rosso">🔴 Ruota Fortuna</a>
        <a href="volantini/index.html" class="btn btn-rosso">📕 Volantini</a>
        <a href="check-lab/index.html" class="btn btn-rosso">💻 Laboratorio</a>
        <a href="sarabanda/index.html" class="btn btn-rosso">🎧 Sarabanda</a>
        <a href="trivial/index.html" class="btn btn-rosso">🎲 Trivial</a>
        <a href="suggeritore/index.html" class="btn btn-rosso">🔎 Suggeritore</a>
        <a href="cerca-spartiti/index.html" class="btn btn-rosso">🎼 Spartiti</a>
        <a href="pierino/index.html" class="btn btn-rosso">🎻 Pierino</a>
    </div>

</body>
</html>
