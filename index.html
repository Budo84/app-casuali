<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APP-CASUALI</title>
    <style>
        body { 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            color: white; 
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;

            /* Sfondo generale scuro con immagine */
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1920&auto=format&fit=crop');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
        }
        
        h1 { 
            margin-bottom: 30px; 
            text-align: center;
            font-size: 3rem;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.5); 
        }

        .bottoni-container {
            display: flex;
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 20px; 
            max-width: 900px; 
            
            /* Effetto vetro */
            background: rgba(255, 255, 255, 0.1); 
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        /* --- STILE BASE DEL BOTTONE CON VARIABILI --- */
        .btn {
            background: var(--bg-color); /* Usa la variabile del colore sfondo */
            color: white; 
            text-decoration: none;
            padding: 20px 20px; 
            border-radius: 10px;
            font-size: 1.2rem; 
            font-weight: bold; 
            width: 200px; 
            text-align: center;
            display: block; 
            box-shadow: 0 4px 0 var(--shadow-color); /* Usa la variabile del colore ombra */
            transition: all 0.2s ease; 
        }

        .btn:hover {
            transform: translateY(-2px); 
            box-shadow: 0 6px 0 var(--shadow-color); /* L'ombra cresce e mantiene il suo colore! */
        }

        .btn:active { 
            transform: translateY(4px); 
            box-shadow: none; 
        }

        /* --- COLORI SPECIFICI PER OGNI BOTTONE --- */
        .btn-pizza { --bg-color: #e67e22; --shadow-color: #d35400; }         /* Arancione pomodoro/crosta */
        .btn-family { --bg-color: #2ecc71; --shadow-color: #27ae60; }        /* Verde rassicurante/casa */
        .btn-ruota { --bg-color: #9b59b6; --shadow-color: #8e44ad; }         /* Viola casinò/gioco */
        .btn-volantini { --bg-color: #3498db; --shadow-color: #2980b9; }     /* Azzurro carta/informativo */
        .btn-lab { --bg-color: #34495e; --shadow-color: #2c3e50; }           /* Blu scuro tecnologico */
        .btn-sarabanda { --bg-color: #fd79a8; --shadow-color: #e84393; }     /* Rosa fluo musicale/pop */
        .btn-trivial { --bg-color: #1abc9c; --shadow-color: #16a085; }       /* Verde acqua da tavolo da gioco */
        .btn-suggeritore { --bg-color: #f39c12; --shadow-color: #e67e22; }   /* Giallo/Arancio "evidenziatore" */
        .btn-spartiti { --bg-color: #636e72; --shadow-color: #2d3436; }      /* Grigio scuro per la musica su carta */
        .btn-pierino { --bg-color: #d35400; --shadow-color: #a04000; }       /* Marroncino legno violino */
        .btn-pixelart { --bg-color: #00d394; --shadow-color: #00d394; }       /* Verde acqua */
        .btn-convertitore-doc { --bg-color: #0004d3; --shadow-color: #0004d3; }       /* Blu */
        .btn-convertitore-audio { --bg-color: #d30066; --shadow-color: #d30066; }       /* Fucsia */
        .btn-convertitore-immagini { --bg-color: #d39b00; --shadow-color: #d39b00; }       /* Arancione */
        .btn-spesa-comune { --bg-color: #00d320; --shadow-color: #00d320; }       /* Verde */
        .btn-spesa-comune { --bg-color: #002ad3; --shadow-color: #002ad3; }       /*blu*/
    </style>
</head>
<body>

    <h1>APP-CASUALI</h1>

        <a href="check-lab/index.html" class="btn btn-lab">💻 Laboratorio</a>

        <a href="trivial/index.html" class="btn btn-trivial">🎲 Trivial</a>

        <a href="convertitore-doc/converter.html" class="btn btn-convertitore-doc">📓 Convertitore-Doc</a>
        <a href="convertitore-audio/index.html" class="btn btn-convertitore-audio">🎶 Convertitore-Audio</a>
        <a href="convertitore-immagini/index.html" class="btn btn-convertitore-immagini"> 🎨 Convertitore-Immagini</a>
        <a href="spesa-comune/index.html" class="btn btn-spesa-comune"> 🛒 Spesa-comune</a>
