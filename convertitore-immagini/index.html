<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Immagini - Prof Edition</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #2c2c2e;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h2 { margin-top: 0; }
        input[type="file"], select, button {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
            font-size: 16px;
        }
        select {
            background-color: #3a3a3c;
            color: white;
            cursor: pointer;
        }
        button {
            background-color: #0a84ff;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #006ee6; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ Convertitore Immagini</h2>
        <p>100% Locale. Nessun file viene inviato su internet.</p>
        
        <input type="file" id="imageInput" accept="image/*">
        
        <select id="formatSelect">
            <option value="image/png">Converti in PNG</option>
            <option value="image/jpeg">Converti in JPG</option>
            <option value="image/webp">Converti in WebP (Leggero)</option>
        </select>
        
        <button onclick="convertiImmagine()">Converti e Scarica</button>
        
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script>
        function convertiImmagine() {
            const fileInput = document.getElementById('imageInput');
            const format = document.getElementById('formatSelect').value;
            
            if (fileInput.files.length === 0) {
                alert("Prof, devi prima selezionare un'immagine! 😉");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            // Quando il file viene caricato in memoria...
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.getElementById('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    canvas.width = img.width;
                    canvas.height = img.height;
                    
                    // Trucco: se convertiamo da PNG trasparente a JPG, mettiamo lo sfondo bianco (altrimenti diventa nero)
                    if (format === 'image/jpeg') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                    
                    ctx.drawImage(img, 0, 0);
                    
                    // Creiamo il nuovo nome del file
                    const nomeOriginale = file.name.split('.').slice(0, -1).join('.');
                    const estensione = format === 'image/jpeg' ? 'jpg' : format.split('/')[1];
                    const nuovoNome = `${nomeOriginale}_convertita.${estensione}`;

                    // Creiamo il link magico per forzare il download
                    const link = document.createElement('a');
                    link.download = nuovoNome;
                    link.href = canvas.toDataURL(format, 0.9); // 0.9 = Qualità al 90%
                    link.click();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }
    </script>

</body>
</html>
