name: Aggiorna Menu Spesa

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
  repository_dispatch:
    types: [start_analysis, webhook]
  push:
    paths:
      - 'spesa/ricette_utenti/**'
      - 'spesa/allergeni.json'

concurrency:
  group: menu_update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa Librerie (NO GOOGLE SDK)
        run: |
          pip install --upgrade pip
          pip install requests pymupdf

      - name: 🛒 Analisi Offerte
        if: github.event_name == 'repository_dispatch' && github.event.action == 'start_analysis'
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python spesa/gestione_offerte.py

      # if: always() -> gira anche se lo step sopra e' fallito o e' stato saltato,
      # cosi' il menu si aggiorna comunque con le offerte disponibili (vecchie o nuove).
      - name: 🍳 Aggiorna Menu
        if: always()
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: python spesa/gestione_menu.py

      # if: always() -> salva e pubblica SEMPRE quello che c'e', anche se qualcosa
      # sopra e' fallito. Cosi' l'app mostra sempre lo stato piu' recente possibile
      # invece di restare "silenziosamente" con i dati vecchi.
      - name: Salva su GitHub
        if: always()
        run: |
          git config --global user.name 'Robot Spesa'
          git config --global user.email 'robot@spesa.app'

          git add spesa/dati_settimanali.json
          git add spesa/offerte.json || true
          git add spesa/allergeni.json || true

          git rm spesa/ricette_utenti/*.json --ignore-unmatch

          git commit -m "🤖 Update Menu & Offerte (REST API)" || echo "Nessuna modifica"
          git pull --rebase origin main || git pull --rebase origin master
          git push

      # Se l'analisi offerte e' effettivamente fallita, fai apparire il job come rosso
      # (cosi' te ne accorgi nella tab Actions), ma SOLO DOPO aver gia' salvato/pushato.
      - name: Segnala fallimento analisi (se avvenuto)
        if: failure()
        run: |
          echo "⚠️ Uno o piu' step hanno fallito. Controlla i log sopra ('Analisi Offerte' / 'Aggiorna Menu') per il motivo esatto (es. secret GEMINI_KEY mancante o non valida, modello Gemini non disponibile, ecc)."
          exit 1
