name: Auto Volantini Python

on:
  push:
    paths:
      - 'volantini/input/*.pdf' # Scatta quando carichi un PDF

permissions:
  contents: write

jobs:
  python-process:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./volantini # Lavora nella cartella corretta

    steps:
      - name: 📥 Scarica Repository
        uses: actions/checkout@v3

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 

      - name: 📦 Installa Dipendenze
        run: |
          pip install -r requirements.txt

      - name: 🤖 Esegui Script Python
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/processor.py

      - name: 💾 Salva JSON su GitHub
        run: |
          git config --global user.name "PythonBot"
          git config --global user.email "bot@github.com"
          cd .. 
          git add volantini/output/offerte.json
          git commit -m "Offerte estratte con Python [skip ci]" || echo "Nessuna modifica"
          git push
