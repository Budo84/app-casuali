name: Elaborazione Volantino AI

on:
  push:
    paths:
      - 'volantini/input/*.pdf' # Si attiva SOLO se carichi un PDF qui

permissions:
  contents: write # Fondamentale per salvare il file JSON

jobs:
  extract-data:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Scarica il codice
        uses: actions/checkout@v3

      - name: 🟢 Prepara Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 📦 Installa dipendenze
        run: npm install

      - name: 🤖 Esegui AI Parser
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/processor.js

      - name: 💾 Salva il risultato (Commit)
        run: |
          git config --global user.name "AI Bot"
          git config --global user.email "bot@github.com"
          git add volantini/output/offerte.json
          git commit -m "Aggiornamento automatico offerte [skip ci]" || echo "Nessuna modifica"
          git push
