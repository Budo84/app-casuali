<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winter Cup 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* bg-slate-900 */
            color: #f8fafc; /* text-slate-50 */
        }
        
        /* Nasconde le frecce dai campi numerici */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"], input[type="date"] {
            -moz-appearance: textfield;
        }
        
        /* Icona calendario input date (Dark Mode) */
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }
        
        /* Scrollbar personalizzata */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #2563eb; }

        .tab-active {
            border-bottom: 3px solid #3b82f6;
            color: #60a5fa;
            font-weight: 600;
        }
        
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-slate-800 shadow-lg shadow-black/20 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col items-center py-4 sm:flex-row sm:justify-between">
                <div class="flex items-center gap-3 mb-4 sm:mb-0">
                    <svg class="w-8 h-8 text-blue-500 drop-shadow-md" fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 19.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.22.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm5.94-1.84A7.957 7.957 0 0 0 19 12c0-1.85-.63-3.56-1.68-4.9l-2.02 2.02v2.38l-2 2-1 1v2l4.64 3.59zM12.5 4.07c2.61.35 4.88 1.8 6.2 3.9l-2.7 2.7h-1v-2l-2-2V4.57c.16-.02.33-.05.5-.07l-.5-.43zm-5.7 3.83A7.925 7.925 0 0 0 5.1 12c0 .54.06 1.06.15 1.58L9.5 9.32V7.5l-2.7.4z"/>
                    </svg>
                    <h1 class="text-xl md:text-2xl font-bold tracking-tight text-white uppercase"><span class="text-blue-500">Winter Cup</span> 2026</h1>
                </div>
                <!-- Tabs -->
                <nav class="flex space-x-2 sm:space-x-4 w-full sm:w-auto justify-center">
                    <button onclick="switchTab('calendario')" id="tab-calendario" class="tab-btn tab-active px-3 py-2 text-sm md:text-base text-slate-300 hover:text-white transition-colors duration-200">
                        Calendario
                    </button>
                    <button onclick="switchTab('classifica')" id="tab-classifica" class="tab-btn px-3 py-2 text-sm md:text-base text-slate-300 hover:text-white transition-colors duration-200">
                        Classifica
                    </button>
                    <button onclick="switchTab('allenamenti')" id="tab-allenamenti" class="tab-btn px-3 py-2 text-sm md:text-base text-slate-300 hover:text-white transition-colors duration-200 text-center">
                        Impegni
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">

        <!-- TAB 1: CALENDARIO -->
        <section id="sec-calendario" class="section-content block animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-blue-400">Calendario Partite</h2>
                <span class="text-xs text-emerald-400 bg-emerald-400/10 border border-emerald-500/20 px-2 py-1 rounded shadow-inner flex items-center gap-1">
                    <span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Salvataggio Attivo
                </span>
            </div>
            
            <div id="calendario-container" class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-10">
                <!-- Generato tramite JS -->
            </div>
        </section>

        <!-- TAB 2: CLASSIFICA -->
        <section id="sec-classifica" class="section-content hidden animate-fade-in">
            <h2 class="text-2xl font-semibold text-blue-400 mb-6">Classifica Generale</h2>
            <div class="bg-slate-800 rounded-xl shadow-lg overflow-hidden border border-slate-700">
                <div class="overflow-x-auto">
                    <table class="w-full text-left whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-900 border-b border-slate-700 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                                <th class="px-4 py-3 text-center w-12">Pos</th>
                                <th class="px-4 py-3">Squadra</th>
                                <th class="px-4 py-3 text-center text-blue-400 font-bold">Punti</th>
                                <th class="px-4 py-3 text-center" title="Giocate">G</th>
                                <th class="px-4 py-3 text-center" title="Vittorie">V</th>
                                <th class="px-4 py-3 text-center" title="Pareggi">N</th>
                                <th class="px-4 py-3 text-center" title="Sconfitte">P</th>
                                <th class="px-4 py-3 text-center" title="Gol Fatti">GF</th>
                                <th class="px-4 py-3 text-center" title="Gol Subiti">GS</th>
                                <th class="px-4 py-3 text-center" title="Differenza Reti">DR</th>
                                <th class="px-4 py-3 text-center">Esito</th>
                            </tr>
                        </thead>
                        <tbody id="classifica-body" class="divide-y divide-slate-700">
                            <!-- Generato tramite JS -->
                        </tbody>
                    </table>
                </div>
                <div class="bg-slate-900 px-4 py-3 text-xs text-slate-400 border-t border-slate-700 flex flex-wrap gap-4">
                    <p><span class="inline-block w-3 h-3 bg-emerald-500 rounded-full mr-1 align-middle"></span> Qualificata Playoff (1ª-4ª)</p>
                    <p><span class="inline-block w-3 h-3 bg-red-500 rounded-full mr-1 align-middle"></span> Eliminata / Finalina (5ª-6ª)</p>
                </div>
            </div>
        </section>

        <!-- TAB 3: TIMELINE / SLIDER -->
        <section id="sec-allenamenti" class="section-content hidden animate-fade-in">
            <h2 class="text-2xl font-semibold text-blue-400 mb-6">Programma Eventi</h2>
            
            <!-- Slider Responsive -->
            <div id="prossimo-impegno-container" class="mb-10">
                <!-- Generato tramite JS -->
            </div>

            <h3 class="text-xl font-semibold text-slate-300 mb-4">Cronologia Completa</h3>
            <div class="bg-slate-800 rounded-xl p-4 sm:p-6 shadow-lg border border-slate-700 max-h-[500px] overflow-y-auto">
                <div id="allenamenti-container" class="space-y-2">
                    <!-- Generato tramite JS -->
                </div>
            </div>
        </section>

    </main>

    <!-- Modal Recupero (Reschedule) -->
    <div id="reschedule-modal" class="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 animate-fade-in">
        <div class="bg-slate-800 border border-slate-600 rounded-xl shadow-2xl w-full max-w-sm overflow-hidden flex flex-col">
            <div class="bg-slate-900 px-4 py-3 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-bold text-white text-lg flex items-center gap-2">
                    <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    Imposta Recupero
                </h3>
                <button onclick="closeRescheduleModal()" class="text-slate-400 hover:text-white transition-colors p-1 rounded hover:bg-slate-700">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-5 space-y-4">
                <p id="modal-match-title" class="text-sm font-medium text-slate-300 bg-slate-900/50 p-3 rounded-lg border border-slate-700 leading-relaxed text-center"></p>
                <div class="flex flex-col gap-2">
                    <label class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Seleziona Nuova Data:</label>
                    <input type="date" id="modal-date-input" class="bg-slate-900 text-white rounded-lg border border-slate-600 p-3 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 w-full transition-colors cursor-pointer" style="color-scheme: dark;">
                </div>
            </div>
            <div class="px-5 py-4 bg-slate-900/80 border-t border-slate-700 flex flex-col sm:flex-row justify-between gap-3">
                <button onclick="clearRescheduleDate()" class="text-sm px-4 py-2 text-red-400 border border-red-400/30 hover:bg-red-500 hover:text-white rounded-lg transition-colors order-2 sm:order-1 w-full sm:w-auto font-medium">Rimuovi</button>
                <div class="flex gap-2 w-full sm:w-auto order-1 sm:order-2 justify-end">
                    <button onclick="closeRescheduleModal()" class="text-sm px-4 py-2 text-slate-300 hover:text-white hover:bg-slate-700 rounded-lg transition-colors w-full sm:w-auto">Annulla</button>
                    <button onclick="saveRescheduleDate()" class="text-sm px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg shadow-md transition-colors w-full sm:w-auto font-bold flex items-center justify-center gap-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        Salva
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- DATA MODELS ---
        const LOCAL_STORAGE_KEY = 'wintercup2026_data_v3';
        const teams = ["Atl Lodigiani", "Calcutta Team", "Cr Sport", "San Vincenzo De Paoli", "Soccer Sgl", "Sam 89"];
        const daysIT = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
        
        // Le 30 partite con i risultati pre-inseriti richiesti
        const rawMatches = [
            ["17/10", "15:00", "Cr Sport", "Calcutta Team", "3", "1"],
            ["17/10", "16:00", "Soccer Sgl", "San Vincenzo De Paoli", "2", "1"],
            ["24/10", "16:00", "San Vincenzo De Paoli", "Sam 89", "2", "1"],
            ["26/10", "18:15", "Soccer Sgl", "Calcutta Team", "1", "3"],
            ["02/11", "18:15", "Cr Sport", "Soccer Sgl", "", ""],
            ["05/11", "17:15", "Soccer Sgl", "Sam 89", "", ""],
            ["07/11", "16:30", "San Vincenzo De Paoli", "Calcutta Team", "", ""],
            ["07/11", "17:30", "Soccer Sgl", "Atl Lodigiani", "", ""],
            ["09/11", "17:15", "San Vincenzo De Paoli", "Atl Lodigiani", "", ""],
            ["09/11", "17:15", "Calcutta Team", "Sam 89", "", ""],
            ["09/11", "18:15", "Cr Sport", "San Vincenzo De Paoli", "", ""],
            ["14/11", "15:30", "Sam 89", "Atl Lodigiani", "", ""],
            ["14/11", "16:30", "Calcutta Team", "Atl Lodigiani", "", ""],
            ["16/11", "18:15", "Cr Sport", "Atl Lodigiani", "", ""],
            ["16/11", "19:15", "Cr Sport", "Sam 89", "", ""],
            ["19/11", "17:15", "Sam 89", "San Vincenzo De Paoli", "", ""],
            ["21/11", "16:00", "Calcutta Team", "Cr Sport", "", ""],
            ["21/11", "17:00", "Atl Lodigiani", "Soccer Sgl", "", ""],
            ["21/11", "18:00", "Atl Lodigiani", "San Vincenzo De Paoli", "", ""],
            ["23/11", "17:15", "San Vincenzo De Paoli", "Soccer Sgl", "", ""],
            ["23/11", "18:15", "Calcutta Team", "Soccer Sgl", "", ""],
            ["26/11", "17:15", "Sam 89", "Calcutta Team", "", ""],
            ["28/11", "17:00", "Atl Lodigiani", "San Vincenzo De Paoli", "", ""],
            ["28/11", "18:00", "Atl Lodigiani", "Cr Sport", "", ""],
            ["30/11", "17:15", "San Vincenzo De Paoli", "Cr Sport", "", ""],
            ["30/11", "18:15", "Soccer Sgl", "Cr Sport", "", ""],
            ["03/12", "17:15", "Sam 89", "Calcutta Team", "", ""],
            ["03/12", "18:15", "Atl Lodigiani", "Sam 89", "", ""],
            ["05/12", "17:00", "Calcutta Team", "Soccer Sgl", "", ""],
            ["05/12", "18:00", "Sam 89", "Cr Sport", "", ""]
        ];

        // Costruisce la struttura dati base
        const defaultMatches = rawMatches.map((m, index) => {
            const [dd, mm] = m[0].split('/');
            const yyyy = "2026";
            const isoDate = `${yyyy}-${mm}-${dd}`;
            const dateObj = new Date(isoDate);
            const dayName = daysIT[dateObj.getDay()];
            return {
                id: index + 1,
                origDateStr: `${dayName} ${dd}/${mm}/${yyyy} - ${m[1]}`,
                origDateISO: isoDate,
                home: m[2],
                away: m[3],
                hg: m[4] || "",
                ag: m[5] || "",
                rescheduledDate: ""
            };
        });

        let matchesState = [];
        let currentSortedTeams = [];
        let currentRescheduleMatchId = null;

        // Variabili Globali Timeline
        let sliderEvents = [];
        let closestEventIndex = -1;
        let currentSliderIndex = 0;
        
        // Data Attuale Dinamica
        const oggi = new Date();
        oggi.setHours(0, 0, 0, 0);

        // --- CORE LOGIC ---
        function init() {
            loadData();
            calculateStandings(); 
            renderCalendario();
            renderClassifica();
            renderAllenamenti();
        }

        function loadData() {
            const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    // Sovrascrive i dati base con i salvataggi utente (gol e date recupero)
                    matchesState = defaultMatches.map(dm => {
                        const found = parsed.find(ms => ms.id === dm.id);
                        return found ? { ...dm, hg: found.hg, ag: found.ag, rescheduledDate: found.rescheduledDate } : dm;
                    });
                } catch (e) {
                    matchesState = [...defaultMatches];
                }
            } else {
                matchesState = JSON.parse(JSON.stringify(defaultMatches));
            }
        }

        function saveData() {
            localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(matchesState));
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section-content').forEach(el => {
                el.classList.add('hidden');
                el.classList.remove('block');
            });
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('tab-active'));
            
            document.getElementById(`sec-${tabId}`).classList.remove('hidden');
            document.getElementById(`sec-${tabId}`).classList.add('block');
            document.getElementById(`tab-${tabId}`).classList.add('tab-active');
        }

        function formatItalianDate(isoString) {
            if(!isoString) return "";
            const d = new Date(isoString);
            const dayName = daysIT[d.getDay()];
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            return `${dayName} ${dd}/${mm}/${d.getFullYear()}`;
        }

        function calculateStandings() {
            let stats = {};
            teams.forEach(t => {
                stats[t] = { name: t, pts: 0, p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0 };
            });

            matchesState.forEach(m => {
                // Solo se la partita ha risultati numerici validi
                if (m.hg !== "" && m.ag !== "" && m.hg !== null && m.ag !== null) {
                    let hg = parseInt(m.hg);
                    let ag = parseInt(m.ag);

                    if (stats[m.home]) {
                        stats[m.home].p++; stats[m.home].gf += hg; stats[m.home].ga += ag;
                        stats[m.home].gd = stats[m.home].gf - stats[m.home].ga;
                    }
                    if (stats[m.away]) {
                        stats[m.away].p++; stats[m.away].gf += ag; stats[m.away].ga += hg;
                        stats[m.away].gd = stats[m.away].gf - stats[m.away].ga;
                    }

                    if (hg > ag) {
                        if(stats[m.home]) { stats[m.home].pts += 3; stats[m.home].w++; }
                        if(stats[m.away]) { stats[m.away].l++; }
                    } else if (hg < ag) {
                        if(stats[m.away]) { stats[m.away].pts += 3; stats[m.away].w++; }
                        if(stats[m.home]) { stats[m.home].l++; }
                    } else {
                        if(stats[m.home]) { stats[m.home].pts += 1; stats[m.home].d++; }
                        if(stats[m.away]) { stats[m.away].pts += 1; stats[m.away].d++; }
                    }
                }
            });

            let classificaArr = Object.values(stats);
            classificaArr.sort((a, b) => {
                if (b.pts !== a.pts) return b.pts - a.pts; 
                if (b.gd !== a.gd) return b.gd - a.gd;     
                return b.gf - a.gf;                        
            });

            currentSortedTeams = classificaArr;
        }

        // --- RENDER FUNCTIONS ---
        function renderCalendario() {
            const container = document.getElementById('calendario-container');
            container.innerHTML = '';

            let groupedByDate = {};
            matchesState.forEach(m => {
                const activeIso = m.rescheduledDate || m.origDateISO;
                if (!groupedByDate[activeIso]) groupedByDate[activeIso] = [];
                groupedByDate[activeIso].push(m);
            });

            const sortedDates = Object.keys(groupedByDate).sort((a, b) => new Date(a) - new Date(b));

            sortedDates.forEach(dateIso => {
                const matchesOnDate = groupedByDate[dateIso];
                const dateTitle = formatItalianDate(dateIso);
                
                let cardHTML = `
                    <div class="bg-slate-800 rounded-xl shadow-md border border-slate-700 overflow-hidden h-fit flex flex-col transition-all">
                        <div class="bg-slate-900 px-4 py-2 border-b border-slate-700">
                            <h3 class="font-bold tracking-wide text-blue-400 text-sm uppercase">${dateTitle}</h3>
                        </div>
                        <div class="p-3 space-y-4">
                `;

                matchesOnDate.forEach(m => {
                    let displayDate = `<span>${m.origDateStr}</span>`;
                    if (m.rescheduledDate) {
                        displayDate = `<span class="line-through text-slate-500">${m.origDateStr}</span> <span class="text-blue-400 font-bold ml-1">${formatItalianDate(m.rescheduledDate)} <span class="text-[9px] uppercase border border-blue-400/50 px-1 rounded ml-1 bg-blue-400/10">Recupero</span></span>`;
                    }

                    cardHTML += `
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center justify-between">
                                <div class="text-[10px] text-slate-400 flex items-center gap-1 truncate w-full pr-2">
                                    <svg class="w-3 h-3 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <div class="truncate">${displayDate}</div>
                                </div>
                                <button onclick="openRescheduleModal(${m.id})" class="text-[9px] uppercase font-bold text-slate-400 border border-slate-600 hover:text-white hover:bg-slate-700 px-2 py-0.5 rounded transition-colors shrink-0 flex items-center gap-1">
                                    🔄 Rimanda
                                </button>
                            </div>
                            
                            <div class="flex items-center justify-between bg-slate-700/40 p-2 rounded border border-slate-600/50">
                                <div class="flex-1 text-right pr-2 truncate">
                                    <span class="text-sm font-semibold text-white truncate w-full inline-block" title="${m.home}">${m.home}</span>
                                </div>
                                <div class="flex items-center gap-1 shrink-0">
                                    <input type="number" min="0" max="99" data-id="${m.id}" data-type="hg" value="${m.hg}" 
                                           class="w-10 h-8 text-center bg-slate-900 border border-slate-500 rounded font-bold text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
                                           onchange="updateScore(this)">
                                    <span class="text-slate-500 font-bold">-</span>
                                    <input type="number" min="0" max="99" data-id="${m.id}" data-type="ag" value="${m.ag}" 
                                           class="w-10 h-8 text-center bg-slate-900 border border-slate-500 rounded font-bold text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
                                           onchange="updateScore(this)">
                                </div>
                                <div class="flex-1 text-left pl-2 truncate">
                                    <span class="text-sm font-semibold text-white truncate w-full inline-block" title="${m.away}">${m.away}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                cardHTML += `</div></div>`;
                container.innerHTML += cardHTML;
            });
        }

        function renderClassifica() {
            const tbody = document.getElementById('classifica-body');
            tbody.innerHTML = '';

            currentSortedTeams.forEach((team, index) => {
                const pos = index + 1;
                const isTop4 = pos <= 4;
                
                const rowClass = isTop4 ? "hover:bg-slate-700/50 transition-colors" : "bg-slate-900/50 opacity-90 hover:opacity-100 transition-colors";
                const posClass = isTop4 ? "bg-emerald-600/20 text-emerald-400 font-bold" : "bg-red-600/20 text-red-400 font-bold";
                const indicator = isTop4 ? `<div class="w-1 absolute left-0 top-0 bottom-0 bg-emerald-500"></div>` : `<div class="w-1 absolute left-0 top-0 bottom-0 bg-red-500"></div>`;
                const esito = isTop4 ? "Qualificata" : "Eliminata";
                const esitoColor = isTop4 ? "text-emerald-400" : "text-red-400";

                tbody.innerHTML += `
                    <tr class="${rowClass} relative">
                        ${indicator}
                        <td class="px-4 py-3 text-center"><span class="inline-block w-6 h-6 rounded-full ${posClass} leading-6 text-xs">${pos}</span></td>
                        <td class="px-4 py-3 font-semibold text-white whitespace-nowrap">${team.name}</td>
                        <td class="px-4 py-3 text-center text-blue-400 font-bold text-lg">${team.pts}</td>
                        <td class="px-4 py-3 text-center text-slate-300 font-medium">${team.p}</td>
                        <td class="px-4 py-3 text-center text-slate-400">${team.w}</td>
                        <td class="px-4 py-3 text-center text-slate-400">${team.d}</td>
                        <td class="px-4 py-3 text-center text-slate-400">${team.l}</td>
                        <td class="px-4 py-3 text-center text-slate-300">${team.gf}</td>
                        <td class="px-4 py-3 text-center text-slate-300">${team.ga}</td>
                        <td class="px-4 py-3 text-center font-medium ${team.gd > 0 ? 'text-emerald-400' : (team.gd < 0 ? 'text-red-400' : 'text-slate-400')}">${team.gd > 0 ? '+' : ''}${team.gd}</td>
                        <td class="px-4 py-3 text-center font-bold text-xs whitespace-nowrap ${esitoColor}">${esito}</td>
                    </tr>
                `;
            });
        }

        function renderAllenamenti() {
            const startDate = new Date(2026, 9, 13); // 13 Oct 2026
            let endDate = new Date(2026, 11, 12);    // 12 Dec 2026
            
            matchesState.forEach(m => {
                const targetIso = m.rescheduledDate || m.origDateISO;
                const matchDate = new Date(targetIso);
                if(matchDate > endDate) endDate = new Date(matchDate);
            });

            let eventsHTML = '';
            sliderEvents = [];
            closestEventIndex = -1;
            let minDiff = Infinity;
            
            for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
                d.setHours(0, 0, 0, 0);
                
                const dayOfWeek = d.getDay(); 
                const isTraining = (dayOfWeek === 2 || dayOfWeek === 4); // Martedì, Giovedì
                
                const yyyy = d.getFullYear();
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const currentISO = `${yyyy}-${mm}-${dd}`;
                const dateDisplayStr = `${dd}/${mm}/${yyyy}`;
                
                // Filtra solo le partite della Sam 89
                const matchesOnThisDay = matchesState.filter(m => {
                    const activeISO = m.rescheduledDate || m.origDateISO;
                    return activeISO === currentISO && (m.home === "Sam 89" || m.away === "Sam 89");
                });
                
                const isMatch = matchesOnThisDay.length > 0;
                
                if (isTraining || isMatch) {
                    let bgColor, textColor, title, borderColor;
                    
                    if (isMatch) {
                        // Se c'è una partita, sovrascrive l'allenamento (anche se è Martedì/Giovedì)
                        bgColor = "bg-blue-500/20"; textColor = "text-blue-400"; borderColor = "border-l-blue-500";
                        title = `Partita Sam 89`;
                    } else {
                        // Se non c'è partita, ma è Martedì/Giovedì, allora è Allenamento
                        bgColor = "bg-emerald-500/20"; textColor = "text-emerald-400"; borderColor = "border-l-emerald-500";
                        title = "Allenamento";
                    }
                    
                    const dayName = daysIT[dayOfWeek];
                    
                    sliderEvents.push({
                        dateObj: new Date(d), dateStr: dateDisplayStr, dayName: dayName, title: title,
                        bgColor: bgColor, textColor: textColor, borderColor: borderColor
                    });

                    eventsHTML += `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 rounded-lg border border-slate-700/50 ${bgColor} border-l-4 ${borderColor} transition-colors hover:bg-slate-700/50 cursor-default">
                            <div class="font-medium text-slate-200 text-sm mb-1 sm:mb-0 w-32 shrink-0">${dayName} ${dateDisplayStr}</div>
                            <div class="font-bold uppercase text-xs ${textColor} text-right w-full sm:w-auto truncate">
                                ${title}
                            </div>
                        </div>
                    `;
                }
            }

            // Calcola l'evento più vicino ad "oggi" per il focus iniziale
            sliderEvents.forEach((ev, idx) => {
                const diff = ev.dateObj.getTime() - oggi.getTime();
                if (diff >= 0 && diff < minDiff) {
                    minDiff = diff;
                    closestEventIndex = idx;
                }
            });
            
            // Se tutto è passato, punta all'ultimo evento
            if (closestEventIndex === -1) closestEventIndex = Math.max(0, sliderEvents.length - 1);
            
            currentSliderIndex = closestEventIndex;
            updateSliderUI();
            
            document.getElementById('allenamenti-container').innerHTML = eventsHTML;
        }

        function updateSliderUI() {
            if (sliderEvents.length === 0) return;
            const event = sliderEvents[currentSliderIndex];
            
            const isClosestIndex = (currentSliderIndex === closestEventIndex);
            const isPast = event.dateObj.getTime() < oggi.getTime();
            let headerText = isClosestIndex ? "Prossimo Impegno in Programma" : (isPast ? "Impegno Passato" : "Impegno Futuro");

            const prevDisabled = currentSliderIndex === 0 ? "opacity-30 cursor-not-allowed" : "hover:bg-slate-700 cursor-pointer active:scale-95";
            const nextDisabled = currentSliderIndex === sliderEvents.length - 1 ? "opacity-30 cursor-not-allowed" : "hover:bg-slate-700 cursor-pointer active:scale-95";

            const btnTornaOggi = !isClosestIndex ? 
                `<button onclick="goToClosestSlide()" class="mt-4 px-4 py-2 text-xs font-semibold bg-slate-700 hover:bg-slate-600 border border-slate-500 rounded-full text-white transition-all shadow-md active:scale-95 shrink-0">⟲ Torna a Prossimo Impegno</button>` : 
                `<div class="mt-4 px-4 py-2 text-xs text-transparent select-none shrink-0 h-[34px]"></div>`;

            // flex-shrink-0 (shrink-0) sulle frecce evita che escano dallo schermo sui cellulari piccoli
            const html = `
                <div class="bg-gradient-to-br from-slate-800 to-slate-900 rounded-xl p-4 sm:p-6 shadow-xl border-l-4 ${event.borderColor} border border-slate-700 relative flex items-center justify-between gap-2 sm:gap-4 w-full">
                    
                    <button onclick="prevSlide()" class="p-2 sm:p-3 shrink-0 bg-slate-800 border border-slate-600 rounded-full text-white transition-all ${prevDisabled}" ${currentSliderIndex === 0 ? 'disabled' : ''}>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>

                    <div class="flex flex-col items-center gap-1 text-center flex-1 min-w-0">
                        <h3 class="text-[10px] sm:text-xs uppercase tracking-widest text-slate-400 font-bold mb-1 truncate w-full">${headerText}</h3>
                        <div class="text-lg sm:text-3xl font-extrabold text-white truncate w-full" title="${event.dayName} ${event.dateStr}">${event.dayName} ${event.dateStr}</div>
                        <div class="text-sm sm:text-lg font-bold ${event.textColor} truncate w-full" title="${event.title}">${event.title}</div>
                        ${btnTornaOggi}
                    </div>

                    <button onclick="nextSlide()" class="p-2 sm:p-3 shrink-0 bg-slate-800 border border-slate-600 rounded-full text-white transition-all ${nextDisabled}" ${currentSliderIndex === sliderEvents.length - 1 ? 'disabled' : ''}>
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            `;
            document.getElementById('prossimo-impegno-container').innerHTML = html;
        }

        function prevSlide() { if (currentSliderIndex > 0) { currentSliderIndex--; updateSliderUI(); } }
        function nextSlide() { if (currentSliderIndex < sliderEvents.length - 1) { currentSliderIndex++; updateSliderUI(); } }
        function goToClosestSlide() { currentSliderIndex = closestEventIndex; updateSliderUI(); }

        // --- INTERAZIONI UTENTE ---
        function updateScore(inputElement) {
            const matchId = parseInt(inputElement.getAttribute('data-id'));
            const type = inputElement.getAttribute('data-type');
            let val = inputElement.value;
            if (val !== "" && parseInt(val) < 0) { val = "0"; inputElement.value = "0"; }

            const matchIndex = matchesState.findIndex(m => m.id === matchId);
            if (matchIndex !== -1) {
                matchesState[matchIndex][type] = val;
                saveData();
                calculateStandings(); 
                renderClassifica();
            }
        }

        function openRescheduleModal(matchId) {
            currentRescheduleMatchId = matchId;
            const match = matchesState.find(m => m.id === matchId);
            if (!match) return;

            document.getElementById('modal-match-title').innerHTML = `<span class="text-base text-white font-semibold">${match.home} <span class="text-slate-500 font-normal">vs</span> ${match.away}</span>`;
            document.getElementById('modal-date-input').value = match.rescheduledDate || '';
            document.getElementById('reschedule-modal').classList.remove('hidden');
        }

        function closeRescheduleModal() {
            document.getElementById('reschedule-modal').classList.add('hidden');
            currentRescheduleMatchId = null;
        }

        function saveRescheduleDate() {
            if (currentRescheduleMatchId === null) return;
            const newDateStr = document.getElementById('modal-date-input').value;
            applyReschedule(currentRescheduleMatchId, newDateStr);
            closeRescheduleModal();
        }

        function clearRescheduleDate() {
            if (currentRescheduleMatchId === null) return;
            applyReschedule(currentRescheduleMatchId, '');
            closeRescheduleModal();
        }

        function applyReschedule(matchId, newDateStr) {
            const matchIndex = matchesState.findIndex(m => m.id === matchId);
            if (matchIndex !== -1) {
                matchesState[matchIndex].rescheduledDate = newDateStr; 
                saveData();
                renderCalendario();
                renderAllenamenti();
            }
        }

        // Avvio app al caricamento DOM
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
