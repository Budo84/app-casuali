<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertitore Markdown Universale</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8 flex flex-col items-center">

    <div class="w-full max-w-5xl bg-white p-8 rounded-xl shadow-lg" id="main-card">
        <h1 class="text-3xl font-bold mb-6 text-blue-600 text-center">Convertitore Markdown Universale</h1>
        
        <div class="mb-6 p-4 border-2 border-dashed border-gray-300 rounded-lg text-center bg-gray-50 hover:bg-gray-100 transition">
            <label class="block text-gray-700 font-semibold mb-2">1. Carica uno o più file Markdown (.md)</label>
            <input type="file" id="fileInput" accept=".md,.txt" multiple class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
        </div>

        <p id="status" class="text-sm text-center text-gray-500 font-semibold mb-6">Nessun file caricato.</p>

        <div id="file-list" class="w-full mb-6 flex flex-col gap-2"></div>

        <div id="azioni-globali" class="hidden flex flex-col mt-6 pt-6 border-t border-gray-200">
            <h3 class="text-center font-bold text-gray-700 mb-4 text-xl">2. Azioni di Gruppo (Tutti i file)</h3>
            
            <div class="flex flex-wrap justify-center gap-3 mb-4">
                <button onclick="scaricaTuttiHTML()" class="bg-green-600 text-white px-5 py-2 rounded-lg shadow hover:bg-green-700 transition font-semibold">📦 Scarica tutti in .HTML (ZIP)</button>
                <button onclick="scaricaTuttiDOCX()" class="bg-blue-600 text-white px-5 py-2 rounded-lg shadow hover:bg-blue-700 transition font-semibold">📦 Scarica tutti in .DOCX (ZIP)</button>
                <button onclick="scaricaTuttiPDF()" class="bg-red-500 text-white px-5 py-2 rounded-lg shadow hover:bg-red-600 transition font-semibold">🗂️ Scarica tutti in .PDF (Separati)</button>
            </div>
            
            <div class="flex justify-center">
                <button onclick="stampaTuttiPDF()" class="bg-gray-800 text-white px-6 py-2 rounded-lg shadow hover:bg-gray-900 transition font-bold w-full sm:w-auto">
                    🖨️ Unisci tutti in un unico .PDF
                </button>
            </div>
        </div>

        <div id="preview-wrapper" class="hidden mt-8 border-t border-gray-200 pt-6">
            <div class="flex justify-between items-center mb-2">
                <h2 class="font-bold text-xl text-gray-700" id="preview-title">Anteprima</h2>
                <button onclick="chiudiAnteprima()" class="text-red-500 hover:text-red-700 font-bold bg-red-50 px-3 py-1 rounded">Chiudi ✖</button>
            </div>
            <div id="preview-container" class="p-8 bg-white border border-gray-300 rounded shadow-inner prose max-w-none w-full">
                </div>
        </div>
    </div>

    <div id="hidden-print-content" class="hidden prose max-w-none"></div>

    <script>
        let filesData = []; 
        
        const fileInput = document.getElementById('fileInput');
        const fileListDiv = document.getElementById('file-list');
        const azioniGlobali = document.getElementById('azioni-globali');
        const statusP = document.getElementById('status');
        const previewWrapper = document.getElementById('preview-wrapper');
        const previewContainer = document.getElementById('preview-container');
        const previewTitle = document.getElementById('preview-title');
        const hiddenPrintContent = document.getElementById('hidden-print-content');

        // Legge i file caricati
        fileInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            statusP.innerText = `⏳ Elaborazione di ${files.length} file in corso...`;
            filesData = []; 
            chiudiAnteprima();

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const baseName = file.name.replace(/\.[^/.]+$/, "");
                const text = await file.text(); 
                const htmlContent = marked.parse(text);
                
                filesData.push({
                    nomeOriginale: file.name,
                    nomeBase: baseName,
                    html: htmlContent
                });
            }

            statusP.innerText = `✅ ${filesData.length} file caricati e pronti all'uso.`;
            generaListaFile();
            azioniGlobali.classList.remove('hidden');
        });

        // Crea le righe per ogni singolo file
        function generaListaFile() {
            fileListDiv.innerHTML = '';
            filesData.forEach((dati, indice) => {
                fileListDiv.innerHTML += `
                    <div class="flex flex-col md:flex-row justify-between items-center p-3 bg-white border border-gray-200 rounded-lg shadow-sm hover:shadow transition">
                        <span class="font-semibold text-gray-700 mb-2 md:mb-0 break-all w-full md:w-1/3">📄 ${dati.nomeOriginale}</span>
                        <div class="flex gap-2 flex-wrap justify-end w-full md:w-2/3">
                            <button onclick="mostraAnteprima(${indice})" class="bg-purple-100 text-purple-700 px-3 py-1 rounded hover:bg-purple-200 font-medium text-sm">👁️ Anteprima</button>
                            <button onclick="scaricaHTML(${indice})" class="bg-green-100 text-green-700 px-3 py-1 rounded hover:bg-green-200 font-medium text-sm">⬇️ HTML</button>
                            <button onclick="scaricaDOCX(${indice})" class="bg-blue-100 text-blue-700 px-3 py-1 rounded hover:bg-blue-200 font-medium text-sm">⬇️ DOCX</button>
                            <button onclick="scaricaPDFSingolo(${indice})" class="bg-red-100 text-red-700 px-3 py-1 rounded hover:bg-red-200 font-medium text-sm">⬇️ PDF</button>
                        </div>
                    </div>
                `;
            });
        }

        /* --- FUNZIONI SINGOLE --- */
        function mostraAnteprima(indice) {
            const file = filesData[indice];
            previewTitle.innerText = `Anteprima: ${file.nomeOriginale}`;
            previewContainer.innerHTML = file.html;
            previewWrapper.classList.remove('hidden');
            previewWrapper.scrollIntoView({ behavior: 'smooth' });
        }

        function chiudiAnteprima() { previewWrapper.classList.add('hidden'); }

        function scaricaHTML(indice) {
            const file = filesData[indice];
            const blob = new Blob([file.html], { type: 'text/html' });
            saveAs(blob, `${file.nomeBase}.html`);
        }

        function scaricaDOCX(indice) {
            const file = filesData[indice];
            const htmlString = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${file.html}</body></html>`;
            const converted = htmlDocx.asBlob(htmlString);
            saveAs(converted, `${file.nomeBase}.docx`);
        }

        function scaricaPDFSingolo(indice) {
            const file = filesData[indice];
            statusP.innerText = `⏳ Generazione del PDF "${file.nomeBase}" in corso...`;
            
            const element = document.createElement('div');
            element.innerHTML = file.html;
            element.className = 'prose max-w-none';

            html2pdf().set({
                margin: 15,
                filename: `${file.nomeBase}.pdf`,
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(element).save().then(() => {
                statusP.innerText = `✅ PDF scaricato!`;
            });
        }

        /* --- FUNZIONI DI GRUPPO --- */
        async function scaricaTuttiHTML() {
            const zip = new JSZip();
            filesData.forEach(file => { zip.file(`${file.nomeBase}.html`, file.html); });
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, "Tutti_i_file_HTML.zip");
        }

        async function scaricaTuttiDOCX() {
            const zip = new JSZip();
            filesData.forEach(file => {
                const htmlString = `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>${file.html}</body></html>`;
                const converted = htmlDocx.asBlob(htmlString);
                zip.file(`${file.nomeBase}.docx`, converted);
            });
            const content = await zip.generateAsync({type:"blob"});
            saveAs(content, "Tutti_i_file_DOCX.zip");
        }

        async function scaricaTuttiPDF() {
            statusP.innerText = "⏳ Generazione in corso. I PDF verranno scaricati uno ad uno, attendere...";
            for (let i = 0; i < filesData.length; i++) {
                const file = filesData[i];
                const element = document.createElement('div');
                element.innerHTML = file.html;
                element.className = 'prose max-w-none';
                
                // Genera e scarica i file in sequenza
                await html2pdf().set({
                    margin: 15,
                    filename: `${file.nomeBase}.pdf`,
                    html2canvas: { scale: 2 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(element).save();
            }
            statusP.innerText = "✅ Download di tutti i PDF completato!";
        }

        function stampaTuttiPDF() {
            const htmlUnito = filesData.map(file => `<div>${file.html}</div>`).join('<div style="page-break-after: always;"></div>');
            hiddenPrintContent.innerHTML = htmlUnito;
            window.print();
        }
    </script>

    <style>
        /* Nasconde UI durante la stampa unita */
        @media print {
            body { background: white; padding: 0; }
            #main-card { display: none !important; }
            #hidden-print-content { display: block !important; width: 100%; }
        }
    </style>
</body>
</html>
