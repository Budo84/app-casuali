<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Drive Player</title>
    <link rel="stylesheet" href="style.css">
    <!-- Questo script carica la libreria ufficiale di Google per il login -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div class="container">
        <h1>🎵 Drive Music Player</h1>
        
        <!-- Bottone di Login -->
        <button id="login-btn" onclick="handleAuthClick()">Accedi con Google</button>

        <!-- Player Audio (inizialmente nascosto) -->
        <div id="player-container" style="display: none;">
            <h3 id="now-playing">Seleziona un brano...</h3>
            <audio id="audio-player" controls controlsList="nodownload">
                Il tuo browser non supporta l'elemento audio.
            </audio>
        </div>

        <!-- Lista dei brani -->
        <ul id="playlist"></ul>
    </div>

    <!-- Il nostro script personalizzato -->
    <script src="script.js"></script>
</body>
</html>
